<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colosseum & Ludus — B2</title>

<style>
:root{
 --red:#681923;--dark:#360b10;--gold:#c99a3d;
 --cream:#f2e8d2;--paper:#fffaf0;--ink:#2d1c15;
 --line:#d6c097;--green:#277443;--blue:#2c6ea5;--purple:#743985
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#170d0b}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);padding-bottom:78px}
button,input{font:inherit}
#app{max-width:760px;margin:auto;min-height:100vh;background:var(--cream)}

header{
 position:sticky;top:0;z-index:50;
 background:linear-gradient(145deg,var(--dark),var(--red));
 color:white;border-bottom:3px solid var(--gold);padding:10px
}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:18px;margin:0;letter-spacing:1px}
.brand small{color:#ead6a2}
.resources{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.resource{
 text-align:center;font-size:9px;padding:5px 1px;
 border:1px solid #b88b37;border-radius:6px;background:#ffffff0d
}
main{padding:12px;min-height:650px}

.hero{
 background:
 linear-gradient(145deg,#832c35,#3a0d12);
 border:2px solid var(--gold);border-radius:13px;
 color:white;padding:17px;margin-bottom:10px;
 box-shadow:0 5px 14px #0003
}
.hero h2{margin:0 0 5px;font-size:24px}
.hero p{margin:4px 0;color:#ecd9aa}

.card{
 background:var(--paper);border:1px solid var(--line);
 border-radius:11px;padding:12px;margin:9px 0;
 box-shadow:0 2px 7px #42200e18
}
.card h3{margin:0 0 8px;color:var(--red)}
.row,.stat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{padding:7px 0;border-bottom:1px dashed #d9c8a9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.btn{
 width:100%;border:0;border-radius:7px;padding:11px 7px;margin-top:6px;
 color:white;background:linear-gradient(#8d303a,#58141b);
 border-bottom:2px solid #351014
}
.btn.gold{background:linear-gradient(#dfbd70,#a97721);color:#2b1909}
.btn.light{background:#eee1c8;color:#402a1c;border:1px solid #c8af7b}
.btn.blue{background:#28689d}
.btn.purple{background:#703783}
.btn.green{background:#2e7545}
.btn:disabled{opacity:.42}

.big{font-size:25px;font-weight:bold;color:var(--red)}
.muted{font-size:11px;color:#78685b}
.good{color:var(--green);font-weight:bold}
.bad{color:#a52a2a;font-weight:bold}

.gladiator{display:flex;align-items:center;gap:11px}
.avatar{
 width:72px;height:72px;flex:none;border-radius:50%;
 display:grid;place-items:center;font-size:36px;
 background:linear-gradient(#eadbb8,#a77d3c);
 border:3px solid #7b551e
}
.bar{height:9px;background:#dfd1b8;border-radius:20px;overflow:hidden}
.bar span{height:100%;display:block;background:linear-gradient(90deg,#8f2933,#d3a448)}

.room{
 text-align:center;background:#f4e8d0;border:1px solid #cfb887;
 border-radius:8px;padding:10px 3px
}
.room .ico{font-size:25px}
.room b{display:block;font-size:11px;color:var(--red)}

.tag{
 display:inline-block;font-size:10px;padding:3px 6px;margin:2px;
 border-radius:20px;border:1px solid #cbb486;background:#eee1c6
}
.blueTag{background:#e5f0f8;border-color:#6c99bc;color:#205c8e}
.purpleTag{background:#f0e5f4;border-color:#9d70a9;color:#6b3079}

.item{
 background:#f6eddb;border:1px solid #d8c398;
 border-radius:9px;padding:10px;margin:7px 0
}
.sockets{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.socket{
 min-height:44px;padding:7px;border-radius:7px;font-size:10px;
 background:#fffaf0;border:1px dashed #b9a67e
}
.socket.blue{border-color:#6795ba}
.socket.purple{border-color:#9769a3}

.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:8px}
.tabs button{
 white-space:nowrap;border:1px solid #c6ae7a;background:#efe2c7;
 border-radius:20px;padding:7px 11px;color:#43291c
}
.tabs button.on{background:var(--red);color:white;border-color:var(--red)}

.team{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fighter{
 text-align:center;font-size:9px;padding:7px 2px;
 background:#f2e5ca;border:1px solid #ccb481;border-radius:7px
}
.fighter b{display:block;color:var(--red);font-size:10px}

.score{text-align:center;font-size:42px;font-weight:bold;color:var(--red);padding:10px}

.rankrow{
 display:grid;grid-template-columns:35px 1fr auto;
 gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #deceb0
}
.medal{text-align:center;font-size:22px}

.message{
 padding:10px;margin:7px 0;border-left:4px solid var(--gold);
 background:#faf1df
}
.unread{background:#fff0c9}

.badge{
 height:85px;border-radius:10px;border:1px solid #c9a45a;
 background:#f5e8ca;text-align:center;padding:9px 3px;font-size:10px
}
.badge span{display:block;font-size:28px}

.bottom{
 position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;
 display:grid;grid-template-columns:repeat(6,1fr);
 background:#3a0d12;border-top:2px solid var(--gold);z-index:60
}
.bottom button{background:none;border:0;color:#e6d2a8;padding:9px 1px;font-size:8px}
.bottom button span{display:block;font-size:18px}
.bottom button.active{background:#77232c;color:white}

#toast{
 display:none;position:fixed;z-index:100;bottom:80px;left:50%;
 transform:translateX(-50%);width:min(92%,700px);
 background:#251311;color:white;border:1px solid var(--gold);
 border-radius:8px;padding:11px
}
#overlay:empty{display:none}
#overlay{
 position:fixed;inset:0;z-index:90;background:#0009;
 display:flex;align-items:flex-end;justify-content:center
}
.sheet{
 width:min(760px,100%);max-height:82vh;overflow:auto;
 background:var(--cream);border-radius:16px 16px 0 0;
 padding:15px;border-top:3px solid var(--gold)
}
</style>
</head>

<body>
<div id="app">

<header>
 <div class="brand">
  <div>
   <h1>COLOSSEUM & LUDUS</h1>
   <small>Aurea Ludus · Roma</small>
  </div>
  <div style="text-align:right">
   <b id="uiLevel">LV.12</b><br>
   <small id="uiRating">1500 RP</small>
  </div>
 </div>

 <div class="resources">
  <div class="resource">🪙<br><b id="uiGold">0</b></div>
  <div class="resource">💎<br><b id="uiDiamond">0</b></div>
  <div class="resource">🔵<br><b id="uiSapphire">0</b></div>
  <div class="resource">🟣<br><b id="uiRuby">0</b></div>
  <div class="resource">⭐<br><b id="uiExp">0</b></div>
  <div class="resource">⚔️<br><b id="uiCount">0</b></div>
 </div>
</header>

<main id="gameView"></main>

<nav class="bottom" id="bottomNav">
 <button data-page="ludus"><span>🏛️</span>LUDUS</button>
 <button data-page="roster"><span>⚔️</span>KADRO</button>
 <button data-page="arena"><span>🏟️</span>ARENA</button>
 <button data-page="guild"><span>🚩</span>GUILD</button>
 <button data-page="market"><span>🏺</span>PAZAR</button>
 <button data-page="menu"><span>☰</span>MENÜ</button>
</nav>

<div id="toast"></div>
<div id="overlay"></div>
</div>

<script>
(function(){

"use strict";

const DOM={
 view:document.getElementById("gameView"),
 overlay:document.getElementById("overlay"),
 toast:document.getElementById("toast"),
 nav:document.getElementById("bottomNav"),
 gold:document.getElementById("uiGold"),
 diamond:document.getElementById("uiDiamond"),
 sapphire:document.getElementById("uiSapphire"),
 ruby:document.getElementById("uiRuby"),
 exp:document.getElementById("uiExp"),
 count:document.getElementById("uiCount"),
 level:document.getElementById("uiLevel"),
 rating:document.getElementById("uiRating")
};

const KEY="LUDUS_B2";
const OLD_KEYS=["LUDUS_B1","LUDUS_A3","colosseum_pack1"];

const BLUE=[
 "Extra HP +3%",
 "HP Regen +2%",
 "Kondisyon +3%",
 "Kondisyon Regen +2%",
 "Critical +3%",
 "Block Rate +4%"
];

const PURPLE=[
 "Team Skill Power +2%",
 "Team Skill Trigger +2%",
 "Team Passive Resistance +2%",
 "Vanguard +2%",
 "Mars +2%",
 "Aegis +2%",
 "Concordia +2%",
 "Victoria +2%"
];

const CLASS_DATA={
 Murmillo:{
  anti:"Retiarius",
  weak:"Hoplomachus",
  skill:"Scutum Bash",
  passive:"Fortis"
 },
 Secutor:{
  anti:"Retiarius",
  weak:"Murmillo",
  skill:"Hunter's Rush",
  passive:"Pursuit"
 },
 Hoplomachus:{
  anti:"Murmillo",
  weak:"Secutor",
  skill:"Spear Wall",
  passive:"Discipline"
 },
 Retiarius:{
  anti:"Hoplomachus",
  weak:"Secutor",
  skill:"Net Trap",
  passive:"Evasion"
 }
};

function makeEquipment(){
 return [
  ["Silah","Gladius",5],
  ["Kalkan","Scutum",3],
  ["Başlık","Galea",4],
  ["Zırh","Lorica",6],
  ["Kolluk","Manica",2],
  ["Bacaklık","Greaves",2]
 ].map(function(x){
  return{
   slot:x[0],name:x[1],plus:x[2],
   blue:[null,null,null,null],
   purple:[null,null],
   destroyed:false
  };
 });
}

function makeGladiator(name,cls,lvl,ovr){
 return{
  name:name,class:cls,level:lvl,ovr:ovr,
  hp:1300+ovr*7,
  stamina:500+lvl*9,
  agility:110+lvl*3,
  attack:1600+ovr*15,
  defense:150+lvl*8,
  crit:12,
  critRes:10,
  attackSpeed:400,
  block:60,
  condition:100,
  fatigue:0,
  injury:0,
  skillLevel:4,
  passiveLevel:4,
  equipment:makeEquipment()
 };
}

function freshState(){
 return{
  version:2,
  gold:1250000,
  diamond:10,
  sapphire:18,
  ruby:12,
  exp:18400,
  rating:1500,
  level:12,
  selected:0,

  special:{felix:3,vesper:2,tenax:2},

  rooms:{
   training:2,forge:2,infirmary:1,
   kitchen:1,beds:2,chest:2
  },

  staff:{
   doctore:4,faber:4,medicus:3,coquus:3,custos:2
  },

  gladiators:[
   makeGladiator("Aulus Varro","Murmillo",12,72),
   makeGladiator("Cassius Nero","Secutor",8,64),
   makeGladiator("Titus Flavius","Hoplomachus",7,61),
   makeGladiator("Gaius Marcellus","Retiarius",8,63),
   makeGladiator("Decimus Corvus","Murmillo",9,66)
  ],

  arena:{wins:0,losses:0,last:null},

  imperial:{best:0,played:0},

  guild:{
   name:"Aurea Legio",
   members:24,
   max:30,
   power:187420,
   league:"III",
   warWins:7,
   warLosses:3,
   lastWar:null
  },

  market:{
   listed:false,
   listingPrice:6250000,
   purchased:{}
  },

  messages:[
   {
    type:"Sistem",
    title:"Aurea Ludus'a Hoş Geldin",
    body:"Ludus yönetim merkezi hazır.",
    read:false
   },
   {
    type:"Guild",
    title:"Aurea Legio",
    body:"Guild War hazırlıkları başladı.",
    read:false
   }
  ],

  badges:[
   {name:"02/2027 Kupası Galibi",icon:"🏆"},
   {name:"06/2027 Lig Şampiyonu",icon:"🏛️"},
   {name:"100 Arena Zaferi",icon:"⚔️"}
  ]
 };
}

function numberValue(v,fallback){
 const n=Number(v);
 return Number.isFinite(n)?n:fallback;
}

function normalizeEquipment(eq){
 const base=makeEquipment();

 if(!Array.isArray(eq)) return base;

 return base.map(function(def,i){
  const old=eq[i]||{};

  return{
   slot:old.slot||def.slot,
   name:old.name||def.name,
   plus:numberValue(old.plus,def.plus),
   blue:Array.isArray(old.blue)
    ? [old.blue[0]||null,old.blue[1]||null,old.blue[2]||null,old.blue[3]||null]
    : [null,null,null,null],
   purple:Array.isArray(old.purple)
    ? [old.purple[0]||null,old.purple[1]||null]
    : Array.isArray(old.ruby)
      ? [old.ruby[0]||null,old.ruby[1]||null]
      : [null,null],
   destroyed:Boolean(old.destroyed)
  };
 });
}

function normalizeGladiator(old,def){
 const g=Object.assign({},def,old||{});
 g.equipment=normalizeEquipment(old&&old.equipment);
 g.condition=Math.max(0,Math.min(100,numberValue(g.condition,100)));
 g.fatigue=Math.max(0,Math.min(100,numberValue(g.fatigue,0)));
 g.injury=Math.max(0,Math.min(5,numberValue(g.injury,0)));
 return g;
}

function normalizeState(raw){
 const base=freshState();
 const out=Object.assign({},base,raw||{});

 out.special=Object.assign({},base.special,(raw&&raw.special)||{});
 out.rooms=Object.assign({},base.rooms,(raw&&raw.rooms)||{});

 const oldStaff=(raw&&raw.staff)||{};
 out.staff={};

 Object.keys(base.staff).forEach(function(k){
  let v=oldStaff[k];

  if(v && typeof v==="object") v=v.level;

  out.staff[k]=numberValue(v,base.staff[k]);
 });

 const incoming=raw&&Array.isArray(raw.gladiators)?raw.gladiators:[];

 out.gladiators=base.gladiators.map(function(def,i){
  return normalizeGladiator(incoming[i],def);
 });

 if(incoming.length>base.gladiators.length){
  incoming.slice(base.gladiators.length).forEach(function(g){
   const def=makeGladiator(
    g.name||"Gladyatör",
    CLASS_DATA[g.class]?g.class:"Murmillo",
    numberValue(g.level,1),
    numberValue(g.ovr,50)
   );
   out.gladiators.push(normalizeGladiator(g,def));
  });
 }

 out.arena=Object.assign({},base.arena,(raw&&raw.arena)||{});
 out.imperial=Object.assign({},base.imperial,(raw&&raw.imperial)||{});
 out.guild=Object.assign({},base.guild,(raw&&raw.guild)||{});
 out.market=Object.assign({},base.market,(raw&&raw.market)||{});

 if(!out.market.purchased || typeof out.market.purchased!=="object")
  out.market.purchased={};

 out.messages=Array.isArray(raw&&raw.messages)
  ? raw.messages
  : base.messages;

 out.badges=Array.isArray(raw&&raw.badges)
  ? raw.badges
  : base.badges;

 out.selected=Math.max(
  0,
  Math.min(out.gladiators.length-1,numberValue(out.selected,0))
 );

 out.version=2;
 return out;
}

function loadState(){
 let raw=null;

 try{
  raw=JSON.parse(localStorage.getItem(KEY)||"null");
 }catch(e){raw=null;}

 if(!raw){
  for(let i=0;i<OLD_KEYS.length;i++){
   try{
    const found=localStorage.getItem(OLD_KEYS[i]);
    if(found){
     raw=JSON.parse(found);
     break;
    }
   }catch(e){}
  }
 }

 return normalizeState(raw||{});
}

let S=loadState();
let page="ludus";
let equipmentIndex=0;
let marketTab="gladiator";
let messageTab="Sistem";
let toastTimer=null;

function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 updateTop();
}

function fmt(v){
 return numberValue(v,0).toLocaleString("tr-TR");
}

function selected(){
 return S.gladiators[S.selected];
}

function updateTop(){
 DOM.gold.textContent=fmt(S.gold);
 DOM.diamond.textContent=S.diamond;
 DOM.sapphire.textContent=S.sapphire;
 DOM.ruby.textContent=S.ruby;
 DOM.exp.textContent=fmt(S.exp);
 DOM.count.textContent=S.gladiators.length;
 DOM.level.textContent="LV."+S.level;
 DOM.rating.textContent=S.rating+" RP";
}

function toast(text){
 DOM.toast.textContent=text;
 DOM.toast.style.display="block";

 clearTimeout(toastTimer);

 toastTimer=setTimeout(function(){
  DOM.toast.style.display="none";
 },2400);
}

function stat(a,b){
 return '<div class="stat"><span>'+a+'</span><b>'+b+'</b></div>';
}

function icon(cls){
 const icons={
  Murmillo:"🛡️",
  Secutor:"⚔️",
  Hoplomachus:"🔱",
  Retiarius:"🕸️"
 };
 return icons[cls]||"⚔️";
}

function setPage(next){
 page=next;
 render();
 window.scrollTo(0,0);
}

window.go=setPage;

function render(){
 updateTop();
 DOM.overlay.innerHTML="";

 DOM.nav.querySelectorAll("button").forEach(function(b){
  b.classList.toggle("active",b.dataset.page===page);
 });

 const routes={
  ludus:viewLudus,
  roster:viewRoster,
  gladiator:viewGladiator,
  equipment:viewEquipment,
  item:viewItem,
  quest:viewQuest,
  training:viewTraining,
  rest:viewRest,
  arena:viewArena,
  ranked:viewRanked,
  imperial:viewImperial,
  guild:viewGuild,
  guildwar:viewGuildWar,
  market:viewMarket,
  sell:viewSell,
  messages:viewMessages,
  profile:viewProfile,
  badges:viewBadges,
  leaderboard:viewLeaderboard,
  inventory:viewInventory,
  staff:viewStaff,
  rooms:viewRooms,
  menu:viewMenu
 };

 const fn=routes[page]||viewLudus;
 DOM.view.innerHTML=fn();
}

DOM.nav.addEventListener("click",function(e){
 const button=e.target.closest("button[data-page]");
 if(button) setPage(button.dataset.page);
});

function viewLudus(){
 return `
 <section class="hero">
  <h2>Aurea Ludus</h2>
  <p>Roma · Ludus Seviyesi ${S.level}</p>
  <p>Gladyatörlerini geliştir, ekonomini yönet ve arenada yüksel.</p>
 </section>

 <div class="card">
  <h3>Gladyatörler</h3>
  ${S.gladiators.slice(0,5).map(function(g,i){
   return `
   <div class="stat" onclick="selectGladiator(${i})">
    <span>${g.name}<br><small class="muted">${g.class}</small></span>
    <b>OVR ${g.ovr}</b>
   </div>`;
  }).join("")}
 </div>

 <div class="card">
  <h3>Ludus Bölümleri</h3>
  <div class="grid3">
   ${roomTile("⚔️","Eğitim",S.rooms.training)}
   ${roomTile("🔨","Atölye",S.rooms.forge)}
   ${roomTile("⚕️","Revir",S.rooms.infirmary)}
   ${roomTile("🍖","Mutfak",S.rooms.kitchen)}
   ${roomTile("🛏️","Yatak",S.rooms.beds)}
   ${roomTile("📦","Sandık",S.rooms.chest)}
  </div>
 </div>

 <div class="grid2">
  <button class="btn" onclick="go('quest')">📜 Görevler</button>
  <button class="btn gold" onclick="go('arena')">🏟️ Arena</button>
  <button class="btn light" onclick="go('staff')">👥 Çalışanlar</button>
  <button class="btn light" onclick="go('rooms')">🏛️ Ludus Geliştir</button>
 </div>`;
}

function roomTile(i,n,l){
 return `<div class="room"><div class="ico">${i}</div><b>${n}</b><small>Lv.${l}</small></div>`;
}

function viewRoster(){
 return `
 <section class="hero">
  <h2>Gladyatörler</h2>
  <p>${S.gladiators.length} savaşçı</p>
 </section>

 ${S.gladiators.map(function(g,i){
  return `
  <div class="card" onclick="selectGladiator(${i})">
   <div class="gladiator">
    <div class="avatar">${icon(g.class)}</div>
    <div style="flex:1">
     <div class="row">
      <h3>${g.name}</h3>
      <span class="big">${g.ovr}</span>
     </div>
     <b>${g.class}</b> · Lv.${g.level}
     <div class="muted">
      Kondisyon ${g.condition}/100 · Yorgunluk ${g.fatigue}%
     </div>
    </div>
   </div>
  </div>`;
 }).join("")}`;
}

window.selectGladiator=function(i){
 S.selected=i;
 save();
 setPage("gladiator");
};

function viewGladiator(){
 const g=selected();
 const c=CLASS_DATA[g.class];

 return `
 <section class="hero">
  <div class="gladiator">
   <div class="avatar">${icon(g.class)}</div>
   <div>
    <h2>${g.name}</h2>
    <p>${g.class} · Lv.${g.level}</p>
    <b style="font-size:29px">OVR ${g.ovr}</b>
   </div>
  </div>
 </section>

 <div class="card">
  <h3>Durum</h3>
  ${stat("Kondisyon",g.condition+"/100")}
  <div class="bar"><span style="width:${g.condition}%"></span></div>
  ${stat("Yorgunluk",g.fatigue+"%")}
  ${stat("Sakatlık",g.injury?"Seviye "+g.injury:"Yok")}
 </div>

 <div class="card">
  <h3>Sınıf & Yetenekler</h3>
  ${stat("Sınıf",g.class)}
  ${stat("Anti",c.anti)}
  ${stat("Dezavantaj",c.weak)}
  ${stat(c.skill,"Lv."+g.skillLevel)}
  ${stat(c.passive,"Lv."+g.passiveLevel)}
 </div>

 <div class="card">
  <h3>Savaş İstatistikleri</h3>
  ${stat("Health",fmt(g.hp))}
  ${stat("Stamina",fmt(g.stamina))}
  ${stat("Agility",g.agility)}
  ${stat("Physical Attack",fmt(g.attack))}

function recalcOVR(g){
 const plus=g.equipment.reduce(function(total,e){
  return total+(e.destroyed?0:e.plus);
 },0);

 const value=
  g.level*2.2+
  plus*.55+
  g.attack/180+
  g.defense/40;

 g.ovr=Math.max(1,Math.min(100,Math.round(value)));
}

const MARKET_GLADIATORS=[
 {id:"lucius",name:"Lucius Drusus",class:"Retiarius",ovr:66,price:950000},
 {id:"spartacus",name:"Spartacus Minor",class:"Murmillo",ovr:74,price:1650000},
 {id:"marcusfelix",name:"Marcus Felix",class:"Secutor",ovr:70,price:1280000}
];

function viewMarket(){
 return `
 <section class="hero">
  <h2>Pazar</h2>
  <p>Oyuncular arası ticaret merkezi</p>
 </section>

 <div class="tabs">
  <button class="${marketTab==="gladiator"?"on":""}" onclick="changeMarket('gladiator')">Gladyatör</button>
  <button class="${marketTab==="item"?"on":""}" onclick="changeMarket('item')">Ekipman</button>
  <button class="${marketTab==="stone"?"on":""}" onclick="changeMarket('stone')">Taş</button>
 </div>

 ${marketTab==="gladiator"
   ? marketGladiators()
   : marketTab==="item"
     ? marketItems()
     : marketStones()
 }

 <button class="btn gold" onclick="go('sell')">+ Pazara İlan Ver</button>`;
}

window.changeMarket=function(tab){
 marketTab=tab;
 render();
};

function marketGladiators(){
 return MARKET_GLADIATORS.map(function(x){
  const bought=Boolean(S.market.purchased[x.id]);

  return `
  <div class="card">
   <div class="gladiator">
    <div class="avatar">${icon(x.class)}</div>

    <div style="flex:1">
     <div class="row">
      <h3>${x.name}</h3>
      <span class="big">${x.ovr}</span>
     </div>

     <b>${x.class}</b>
     ${stat("Fiyat",fmt(x.price)+" 🪙")}

     <button class="btn"
      ${bought?"disabled":""}
      onclick="buyGladiator('${x.id}')">
      ${bought?"Satıldı":"Satın Al"}
     </button>
    </div>
   </div>
  </div>`;
 }).join("");
}

window.buyGladiator=function(id){
 const listing=MARKET_GLADIATORS.find(function(x){return x.id===id;});

 if(!listing)return;

 if(S.market.purchased[id]){
  toast("Bu ilan artık mevcut değil.");
  return;
 }

 if(S.gold<listing.price){
  toast("Yeterli altın yok.");
  return;
 }

 S.gold-=listing.price;

 S.gladiators.push(
  makeGladiator(
   listing.name,
   listing.class,
   9,
   listing.ovr
  )
 );

 S.market.purchased[id]=true;

 S.messages.unshift({
  type:"Sistem",
  title:"Pazar Satın Alımı",
  body:listing.name+" Aurea Ludus'a katıldı.",
  read:false
 });

 save();render();
 toast(listing.name+" satın alındı.");
};

function viewSell(){

window.createListing=function(){
 if(S.market.listed){
  toast("Aulus zaten pazarda.");

 }

 S.messages.unshift({
  type:"Sistem",
  title:"Pazar İlanı",
  body:"Aulus Varro 6.250.000 altına pazara konuldu.",
  read:false
 });

 save();render();
 toast("Pazar ilanı oluşturuldu.");
};

function viewMessages(){

function staffName(k){
 return{
  doctore:"Doctore",
  faber:"Faber",
  medicus:"Medicus",
  coquus:"Coquus",
  custos:"Custos"
 }[k];
}

function staffMax(k){
 return k==="doctore"||k==="faber"?20:10;
}

function viewStaff(){
 return `
 <section class="hero">
  <h2>Çalışanlar</h2>
  <p>Ludus personeli</p>
 </section>

 ${Object.keys(S.staff).map(function(k){
  const v=S.staff[k];
  const max=staffMax(k);
  const cost=15000+v*10000;

  return `
  <div class="card">
   ${stat(staffName(k),"Lv."+v+" / "+max)}
   <button class="btn"
    ${v>=max?"disabled":""}
    onclick="upgradeStaff('${k}')">
    Geliştir — ${fmt(cost)} 🪙
   </button>
  </div>`;
 }).join("")}`;
}

window.upgradeStaff=function(k){
 const max=staffMax(k);

 if(S.staff[k]>=max){
  toast("Maksimum seviye.");
  return;
 }

 const cost=15000+S.staff[k]*10000;

 if(S.gold<cost){
  toast("Yeterli altın yok.");
  return;
 }

 S.gold-=cost;
 S.staff[k]++;

 save();render();
 toast(staffName(k)+" geliştirildi.");
};
