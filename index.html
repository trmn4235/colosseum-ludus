<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#651923">
<title>Colosseum & Ludus — BUILD C</title>

<style>
:root{
  --red:#681923;
  --red2:#842934;
  --dark:#2b0b0f;
  --dark2:#451016;
  --gold:#c99a3d;
  --gold2:#e1bd6a;
  --cream:#efe3c9;
  --cream2:#f8efd9;
  --paper:#fffaf0;
  --ink:#2b1c14;
  --muted:#78685b;
  --line:#cfb783;
  --green:#39724b;
  --blue:#286b9f;
  --purple:#713780;
  --danger:#a62d35;
  --shadow:0 5px 18px rgba(49,23,11,.14);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#160b0a;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--ink);
  overscroll-behavior-y:none;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  max-width:820px;
  min-height:100vh;
  margin:auto;
  background:
    linear-gradient(rgba(244,232,205,.97),rgba(244,232,205,.97)),
    repeating-linear-gradient(
      0deg,
      #e7d6b6 0,
      #e7d6b6 1px,
      transparent 1px,
      transparent 8px
    );
  padding-bottom:76px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:
    linear-gradient(145deg,var(--dark),var(--red));
  color:#fff;
  border-bottom:3px solid var(--gold);
  box-shadow:0 4px 15px #0005;
}

.brand-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px 7px;
}

.brand-title{
  font-weight:bold;
  font-size:18px;
  letter-spacing:.8px;
}

.brand-sub{
  margin-top:2px;
  font-size:10px;
  color:#e8d4a5;
}

.build-pill{
  display:inline-block;
  vertical-align:middle;
  margin-left:5px;
  padding:2px 6px;
  border:1px solid var(--gold);
  border-radius:20px;
  color:#f1dba5;
  font-size:8px;
}

.profile-mini{
  text-align:right;
}

.profile-mini b{
  display:block;
  color:#f5dfad;
}

.profile-mini small{
  color:#d9c598;
}

.resource-row{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
  padding:0 8px 8px;
}

.resource-box{
  min-width:0;
  padding:5px 1px;
  text-align:center;
  border:1px solid #a77a30;
  border-radius:7px;
  background:#ffffff0c;
  font-size:9px;
}

.resource-box .ico{
  font-size:14px;
}

.resource-box b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   MAIN
========================================================= */

#game{
  min-height:700px;
  padding:12px;
}

.hero{
  position:relative;
  overflow:hidden;
  margin-bottom:10px;
  padding:17px;
  border:2px solid var(--gold);
  border-radius:14px;
  color:#fff;
  background:
    radial-gradient(circle at 80% 10%,#ad596055,transparent 35%),
    linear-gradient(145deg,#822a35,#350c12);
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-35px;
  width:120px;
  height:120px;
  border:18px solid #d6ac5640;
  border-radius:50%;
}

.hero h1,
.hero h2,
.hero h3{
  position:relative;
  z-index:1;
  margin:0 0 5px;
}

.hero p{
  position:relative;
  z-index:1;
  margin:3px 0;
  color:#eddcaf;
}

.card{
  margin:9px 0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,250,240,.95);
  box-shadow:0 2px 8px #3c1e1016;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.card h3,
.card h4{
  margin:0;
  color:var(--red);
}

.subhead{
  margin:12px 0 5px;
  color:var(--red);
  font-weight:bold;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.muted{
  color:var(--muted);
  font-size:11px;
}

.small{
  font-size:10px;
}

.big{
  font-size:27px;
  font-weight:bold;
  color:var(--red);
}

.gold-text{
  color:#9a6a16;
}

.good{
  color:var(--green);
  font-weight:bold;
}

.bad{
  color:var(--danger);
  font-weight:bold;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.wrap{
  flex-wrap:wrap;
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:7px 0;
  border-bottom:1px dashed #d8c5a2;
}

.stat:last-child{
  border-bottom:0;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  width:100%;
  min-height:43px;
  margin-top:6px;
  padding:10px 8px;
  border:0;
  border-bottom:2px solid #321013;
  border-radius:8px;
  color:#fff;
  background:linear-gradient(#8e303a,#59151c);
}

.btn.gold{
  color:#2a1908;
  background:linear-gradient(#e2c276,#aa7925);
  border-bottom-color:#765117;
}

.btn.light{
  color:#442c1d;
  background:#eee0c3;
  border:1px solid #c5a971;
}

.btn.green{
  background:linear-gradient(#4b8b60,#2f6542);
}

.btn.blue{
  background:linear-gradient(#3f82b5,#245c88);
}

.btn.purple{
  background:linear-gradient(#8d52a0,#633273);
}

.btn.danger{
  background:linear-gradient(#b8464d,#7d2229);
}

.btn:disabled{
  opacity:.42;
  filter:grayscale(.3);
}

.btn.compact{
  min-height:34px;
  padding:7px;
  font-size:11px;
}

/* =========================================================
   BARS / TAGS
========================================================= */

.progress{
  overflow:hidden;
  height:10px;
  margin:5px 0;
  border-radius:20px;
  background:#d8c8a8;
}

.progress > span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--red),#c7903c);
}

.tag{
  display:inline-block;
  margin:2px;
  padding:3px 6px;
  border:1px solid #c9b07c;
  border-radius:20px;
  background:#efe1c5;
  font-size:9px;
}

.tag.blue{
  color:#1e5c8c;
  border-color:#76a0bf;
  background:#e7f1f7;
}

.tag.purple{
  color:#663077;
  border-color:#a57bb0;
  background:#f0e5f3;
}

.tag.green{
  color:#2e6c44;
  border-color:#76a889;
  background:#e8f2e9;
}

.tag.red{
  color:#8a2630;
  border-color:#c58c91;
  background:#f7e7e7;
}

.status{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
}

.status.ready{
  color:#2f6b43;
  background:#dfeee2;
}

.status.busy{
  color:#8b5b10;
  background:#f5e8c4;
}

.status.injury{
  color:#8c2630;
  background:#f2dadd;
}

.status.locked{
  color:#56316d;
  background:#e9ddf0;
}

/* =========================================================
   GLADIATORS
========================================================= */

.gladiator-line{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  flex:none;
  display:grid;
  place-items:center;
  width:70px;
  height:70px;
  border:3px solid #8d6528;
  border-radius:50%;
  background:
    radial-gradient(circle at 40% 30%,#f1e2b8,#ad8040);
  font-size:35px;
}

.gladiator-strip{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:5px 1px 8px;
  scrollbar-width:none;
}

.gladiator-strip::-webkit-scrollbar{
  display:none;
}

.gladiator-chip{
  flex:0 0 88px;
  padding:8px 5px;
  border:1px solid #c8af79;
  border-radius:9px;
  background:#f3e7cc;
  text-align:center;
  font-size:9px;
}

.gladiator-chip.selected{
  outline:3px solid var(--gold);
  background:#fff3d3;
}

.gladiator-chip .face{
  display:block;
  margin-bottom:4px;
  font-size:25px;
}

.gladiator-chip b{
  display:block;
  color:var(--red);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   ITEMS
========================================================= */

.item-card{
  padding:10px;
  border:1px solid #d0b986;
  border-radius:9px;
  background:#f8eed9;
}

.item-card.selected{
  outline:3px solid var(--gold);
}

.item-icon{
  display:grid;
  place-items:center;
  width:45px;
  height:45px;
  border:1px solid #b7975d;
  border-radius:7px;
  background:#e9d7b3;
  font-size:25px;
}

.item-list-row{
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #dfceb0;
}

.item-list-row:last-child{
  border-bottom:0;
}

.socket-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.socket{
  min-height:45px;
  padding:7px;
  border:1px dashed #bba77c;
  border-radius:7px;
  background:#fffaf0;
  font-size:10px;
}

.socket.blue{
  border-color:#6b9bc0;
}

.socket.purple{
  border-color:#9d70a9;
}

/* =========================================================
   MARKET
========================================================= */

.market-row{
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:8px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #decbae;
}

.price{
  color:#9b6919;
  font-weight:bold;
}

.filter-row{
  display:flex;
  gap:5px;
  overflow:auto;
  margin-bottom:8px;
}

.filter-row button{
  white-space:nowrap;
  padding:7px 10px;
  border:1px solid #c6aa72;
  border-radius:20px;
  background:#efe1c4;
  color:#40291c;
}

.filter-row button.active{
  color:#fff;
  border-color:var(--red);
  background:var(--red);
}

/* =========================================================
   INPUTS
========================================================= */

.field{
  width:100%;
  min-height:43px;
  padding:10px;
  border:1px solid #bfa672;
  border-radius:8px;
  outline:none;
  color:var(--ink);
  background:#fffaf0;
}

.field:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 2px #c99a3d30;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;
  right:0;
  bottom:0;
  left:0;
  z-index:120;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  max-width:820px;
  margin:auto;
  border-top:2px solid var(--gold);
  background:#350c11;
}

.bottom-nav button{
  padding:8px 1px;
  border:0;
  color:#dfcca4;
  background:none;
  font-size:8px;
}

.bottom-nav button span{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.bottom-nav button.active{
  color:#fff;
  background:#75222c;
}

/* =========================================================
   OVERLAY / TOAST
========================================================= */

#overlay:empty{
  display:none;
}

#overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:#0009;
}

.sheet{
  width:min(820px,100%);
  max-height:85vh;
  overflow:auto;
  padding:15px;
  border-top:3px solid var(--gold);
  border-radius:16px 16px 0 0;
  background:var(--cream);
}

#toast{
  display:none;
  position:fixed;
  bottom:78px;
  left:50%;
  z-index:250;
  width:min(92%,760px);
  padding:11px;
  transform:translateX(-50%);
  border:1px solid var(--gold);
  border-radius:8px;
  color:#fff;
  background:#241310;
  text-align:center;
  box-shadow:0 4px 18px #0007;
}

.error-card{
  border:2px solid #a32e35;
  background:#fff0ed;
}

/* =========================================================
   DESKTOP ENHANCEMENT
========================================================= */

@media(min-width:700px){
  #game{
    padding:18px;
  }

  .hero{
    padding:22px;
  }

  .desktop2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .desktop3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
}
</style>
</head>

<script>
(function(){

"use strict";

/* =========================================================
   BUILD C
   CORE ENGINE
========================================================= */

var BUILD="C";
var SAVE_KEY="LUDUS_BUILD_C";

var OLD_KEYS=[
  "LUDUS_B21",
  "LUDUS_B2",
  "LUDUS_B1",
  "LUDUS_A3",
  "colosseum_pack1"
];

var APP_STAGE="boot";

var DOM={};

var STATE=null;

var UI={
  page:"home",
  selectedGladiatorId:null,
  selectedItemId:null,
  inventoryCategory:"weapon",
  marketCategory:"weapon",
  marketSort:"lowest",
  marketSearch:"",
  selectedQuestId:null,
  selectedTraining:"sword",
  selectedMarketListing:null,
  messageTab:"system"
};

var toastTimer=null;

/* =========================================================
   UTILITIES
========================================================= */

function id(prefix){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function now(){
  return Date.now();
}

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function number(v,fallback){
  var n=Number(v);
  return isFinite(n)?n:fallback;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function formatNumber(v){
  return Math.round(number(v,0)).toLocaleString("tr-TR");
}

function formatGold(v){
  return formatNumber(v)+" 🪙";
}

function escapeHTML(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function chance(percent){
  return Math.random()*100<percent;
}

function findById(arr,target){
  if(!Array.isArray(arr)) return null;

  for(var i=0;i<arr.length;i++){
    if(arr[i].id===target) return arr[i];
  }

  return null;
}

function removeById(arr,target){
  var index=-1;

  for(var i=0;i<arr.length;i++){
    if(arr[i].id===target){
      index=i;
      break;
    }
  }

  if(index>=0){
    return arr.splice(index,1)[0];
  }

  return null;
}

function sum(arr,fn){
  var total=0;

  for(var i=0;i<arr.length;i++){
    total+=fn(arr[i],i)||0;
  }

  return total;
}

function statRow(label,value){
  return (
    '<div class="stat">'+
      '<span>'+label+'</span>'+
      '<b>'+value+'</b>'+
    '</div>'
  );
}

function progress(value,max){
  var p=max>0?clamp(value/max*100,0,100):0;

  return (
    '<div class="progress">'+
      '<span style="width:'+p+'%"></span>'+
    '</div>'
  );
}

function showToast(text){
  if(!DOM.toast) return;

  DOM.toast.textContent=text;
  DOM.toast.style.display="block";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(function(){
    DOM.toast.style.display="none";
  },2200);
}

function closeOverlay(){
  if(DOM.overlay){
    DOM.overlay.innerHTML="";
  }
}

window.closeOverlay=closeOverlay;

/* =========================================================
   GAME CONSTANTS
========================================================= */

var CLASS_DATA={

var BLUE_STONES={

  hp_regen:{

  },

  block:{

/* =========================================================
   DATE / ACTIVITY
========================================================= */

function dayKey(timestamp){

  var d=timestamp
    ?new Date(timestamp)
    :new Date();

  return (
    d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")
  );

}

function activityLabel(status){

  var labels={
    ready:"Hazır",
    training:"Antrenmanda",
    quest:"Görevde",
    resting:"Dinleniyor",
    injured:"Sakat",
    guild_locked:"Guild War Kilitli",
    market_locked:"Pazarda"
  };

  return labels[status]||"Hazır";

}

function statusClass(status){

  if(status==="ready") return "ready";

  if(status==="injured") return "injury";

  if(
    status==="guild_locked"||
    status==="market_locked"
  ){
    return "locked";
  }

  return "busy";

}

function isGladiatorAvailable(g){

  if(!g) return false;

  if(g.injuryLevel>0) return false;

  return g.status==="ready";

}

function canUseGladiator(g){

  return (
    isGladiatorAvailable(g)&&
    g.condition>=20
  );

}

/* =========================================================
   SAVE / LOAD
========================================================= */

function safeGet(key){

  try{
    return localStorage.getItem(key);
  }catch(e){
    return null;
  }

}

function safeSet(key,value){

  try{
    localStorage.setItem(key,value);
    return true;
  }catch(e){
    return false;
  }

}

function normalizeItem(raw){

  if(!raw) return null;

  return createItem({
    id:raw.id,
    type:ITEM_TYPES[raw.type]
      ?raw.type
      :"weapon",
    model:raw.model||raw.name,
    name:raw.name||raw.model,
    plus:number(raw.plus,0),
    level:number(raw.level,1),
    rarity:raw.rarity||"Standart",
    equippedBy:raw.equippedBy||null,
    stats:raw.stats||{},
    blueSlots:
      raw.blueSlots||
      raw.blue||
      [null,null,null,null],
    purpleSlots:
      raw.purpleSlots||
      raw.purple||
      raw.ruby||
      [null,null],
    createdAt:raw.createdAt
  });

}

function normalizeGladiator(raw,index){

  var fallback=createStarterGladiators()[index]||
    createGladiator({
      name:"Gladyatör "+(index+1)
    });

  if(!raw){
    return fallback;
  }

  var g=createGladiator({

    id:raw.id||fallback.id,

    name:raw.name||fallback.name,

    class:raw.class||fallback.class,

    level:number(
      raw.level,
      fallback.level
    ),

    overall:number(
      raw.overall!=null
        ?raw.overall
        :raw.ovr,
      fallback.overall
    ),

    exp:number(
      raw.exp,
      fallback.exp
    ),

    condition:number(
      raw.condition,
      fallback.condition
    ),

    fatigue:number(
      raw.fatigue,
      fallback.fatigue
    ),

    injuryLevel:number(
      raw.injuryLevel!=null
        ?raw.injuryLevel
        :raw.injury,
      0
    ),

    status:raw.status||"ready",

    stats:raw.stats||{
      hp:number(raw.hp,fallback.stats.hp),
      stamina:number(raw.stamina,fallback.stats.stamina),
      agility:number(raw.agility,fallback.stats.agility),
      attack:number(raw.attack,fallback.stats.attack),
      defense:number(raw.defense,fallback.stats.defense),
      critical:number(raw.crit,fallback.stats.critical),
      criticalResistance:number(raw.critRes,fallback.stats.criticalResistance),
      attackSpeed:number(raw.attackSpeed,fallback.stats.attackSpeed),
      blockRate:number(raw.block,fallback.stats.blockRate)
    },

    skillLevel:number(
      raw.skillLevel,
      fallback.skillLevel
    ),

    passiveLevel:number(
      raw.passiveLevel,
      fallback.passiveLevel
    ),

    lastActiveDay:raw.lastActiveDay

  });

  g.activity=raw.activity||null;
  g.lockedReason=raw.lockedReason||null;

  return g;

}

function migrateLegacy(raw){

  var base=freshState();

  if(!raw){
    return base;
  }

  if(raw.build==="C"){
    return raw;
  }

  if(raw.gold!=null){
    base.gold=number(raw.gold,base.gold);
  }

  if(raw.exp!=null){
    base.ludus.exp=number(
      raw.exp,
      base.ludus.exp
    );
  }

  if(raw.level!=null){
    base.ludus.level=number(
      raw.level,
      base.ludus.level
    );
  }

  if(raw.rating!=null){
    base.arena.rating=number(
      raw.rating,
      base.arena.rating
    );
  }

  if(raw.arena&&raw.arena.rating!=null){
    base.arena.rating=number(
      raw.arena.rating,
      base.arena.rating
    );
  }

  if(Array.isArray(raw.gladiators)){

    base.gladiators=raw.gladiators.map(
      function(g,i){
        return normalizeGladiator(g,i);
      }
    );

  }

  if(raw.diamond!=null){
    base.stones.diamond=number(
      raw.diamond,
      base.stones.diamond
    );
  }

  if(raw.sapphire!=null){
    base.stones.sapphire.extra_hp=
      number(
        raw.sapphire,
        base.stones.sapphire.extra_hp
      );
  }

  if(raw.ruby!=null){
    base.stones.ruby.team_skill_power=
      number(
        raw.ruby,
        base.stones.ruby.team_skill_power
      );
  }

  if(raw.special){

    if(raw.special.felix!=null){
      base.stones.sapphire.felix=
        number(
          raw.special.felix,
          base.stones.sapphire.felix
        );
    }

    if(raw.special.vesper!=null){
      base.stones.sapphire.vesper=
        number(
          raw.special.vesper,
          base.stones.sapphire.vesper
        );
    }

    if(raw.special.tenax!=null){
      base.stones.sapphire.tenax=
        number(
          raw.special.tenax,
          base.stones.sapphire.tenax
        );
    }

  }

  base.messages.unshift({
    id:id("msg"),
    type:"system",
    title:"BUILD C Migrasyonu",
    body:"Önceki oyun kaydındaki temel kaynaklar BUILD C sistemine aktarıldı.",
    read:false,
    createdAt:now()
  });

  return base;

}

function loadState(){

  APP_STAGE="load-build-c";

  var current=safeGet(SAVE_KEY);

  if(current){

    try{
      return JSON.parse(current);
    }catch(e){}
  }

  APP_STAGE="legacy-search";

  for(var i=0;i<OLD_KEYS.length;i++){

    var old=safeGet(OLD_KEYS[i]);

    if(!old) continue;

    try{

      var parsed=JSON.parse(old);

      var migrated=migrateLegacy(parsed);

      migrated.migratedFrom=OLD_KEYS[i];

      return migrated;

    }catch(e){}

  }

  return freshState();

}

function saveState(){

  if(!STATE) return;

  STATE.updatedAt=now();

  safeSet(
    SAVE_KEY,
    JSON.stringify(STATE)
  );

  updateHeader();

}

/* =========================================================
   TRANSACTION LEDGER
========================================================= */

function transactionExists(txId){

  return !!(
    STATE.transactions&&
    STATE.transactions[txId]
  );

}

function runTransaction(txId,fn){

  if(transactionExists(txId)){
    return {
      ok:false,
      duplicate:true
    };
  }

  var snapshot=clone(STATE);

  try{

    var result=fn();

    STATE.transactions[txId]={
      id:txId,
      createdAt:now(),
      status:"complete"
    };

    saveState();

    return {
      ok:true,
      result:result
    };

  }catch(e){

    STATE=snapshot;

    saveState();

    return {
      ok:false,
      error:e
    };

  }

}

/* =========================================================
   ITEM HELPERS
========================================================= */

function getItem(itemId){
  return findById(
    STATE.items,
    itemId
  );
}

function getGladiator(gladiatorId){
  return findById(
    STATE.gladiators,
    gladiatorId
  );
}

function equippedItems(gladiatorId){

  return STATE.items.filter(function(item){
    return (
      item.equippedBy===gladiatorId&&
      !item.destroyed
    );
  });

}

function equippedItemByType(gladiatorId,type){

  var items=equippedItems(gladiatorId);

  for(var i=0;i<items.length;i++){
    if(items[i].type===type){
      return items[i];
    }
  }

  return null;

}

function inventoryItems(type){

  return STATE.items.filter(function(item){

    if(item.destroyed) return false;

    if(type&&item.type!==type){
      return false;
    }

    return true;

  });

}

function freeItems(type){

  return STATE.items.filter(function(item){

    if(item.destroyed) return false;

    if(item.marketLocked) return false;

    if(item.equippedBy) return false;

    if(type&&item.type!==type){
      return false;
    }

    return true;

  });

}

function itemStoneEffects(item){

  var result={
    hpPercent:0,
    hpRegen:0,
    conditionCapacity:0,
    conditionRegen:0,
    critical:0,
    block:0,
    fortuna:0
  };

  if(!item) return result;

  item.blueSlots.forEach(function(key){

    if(!key) return;

    var stone=BLUE_STONES[key];

    if(
      stone&&
      stone.stat&&
      result[stone.stat]!=null
    ){
      result[stone.stat]+=stone.value;
    }

  });

  return result;

}

/* =========================================================
   ITEM POWER / PLUS PREVIEW
========================================================= */

function enhancementMultiplier(plus){

  return 1+(plus*.05);

}

function previewItemStats(item,nextPlus){

  var fromPlus=item.plus;

  var fromMultiplier=
    enhancementMultiplier(fromPlus);

  var toMultiplier=
    enhancementMultiplier(nextPlus);

  var ratio=
    toMultiplier/fromMultiplier;

  var out={};

  Object.keys(item.stats).forEach(function(k){

    out[k]=Math.round(
      item.stats[k]*ratio
    );

  });

  return out;

}

function applyEnhancedStats(item,newPlus){

  var next=previewItemStats(
    item,
    newPlus
  );

  item.stats=next;
  item.plus=newPlus;

}

/* =========================================================
   GLADIATOR CALCULATIONS
========================================================= */

function calculateGladiator(gladiator){

  var result=clone(gladiator.stats);

  var items=equippedItems(
    gladiator.id
  );

  var hpPercent=0;
  var criticalBonus=0;
  var blockBonus=0;

  items.forEach(function(item){

    result.attack+=
      item.stats.attackMin||0;

    result.defense+=
      item.stats.defenseMin||0;

    result.critical+=
      item.stats.critical||0;

    result.criticalResistance+=
      item.stats.criticalResistance||0;

    result.attackSpeed+=
      item.stats.attackRate||0;

    result.blockRate+=
      item.stats.blockRate||0;

    var effects=itemStoneEffects(item);

    hpPercent+=effects.hpPercent;
    criticalBonus+=effects.critical;
    blockBonus+=effects.block;

  });

  result.hp=Math.round(
    result.hp*
    (1+hpPercent/100)
  );

  result.critical+=criticalBonus;
  result.blockRate+=blockBonus;

  return result;

}

function calculateOverall(gladiator){

  var s=calculateGladiator(
    gladiator
  );

  var itemPlus=sum(
    equippedItems(gladiator.id),
    function(item){
      return item.plus;
    }
  );

  var score=
    gladiator.level*1.4+
    s.hp/220+
    s.attack/550+
    s.defense/90+
    s.agility/30+
    itemPlus*.35+
    gladiator.skillLevel*.45+
    gladiator.passiveLevel*.35;

  return clamp(
    Math.round(score),
    1,
    100
  );

}

function refreshOverall(gladiator){

  gladiator.overall=
    calculateOverall(gladiator);

}

/* =========================================================
   EQUIP / UNEQUIP
========================================================= */

function equipItem(
  gladiatorId,
  itemId
){

  var g=getGladiator(
    gladiatorId
  );

  var item=getItem(
    itemId
  );

  if(!g||!item){
    return {
      ok:false,
      message:"Gladyatör veya eşya bulunamadı."
    };
  }

  if(item.destroyed){
    return {
      ok:false,
      message:"Yok edilmiş eşya kullanılamaz."
    };
  }

  if(item.marketLocked){
    return {
      ok:false,
      message:"Satıştaki eşya kullanılamaz."
    };
  }

  if(
    item.equippedBy&&
    item.equippedBy!==g.id
  ){
    return {
      ok:false,
      message:"Eşya başka bir gladyatöre bağlı."
    };
  }

  var current=equippedItemByType(
    g.id,
    item.type
  );

  if(current&&current.id!==item.id){
    current.equippedBy=null;
  }

  item.equippedBy=g.id;

  refreshOverall(g);

  saveState();

  return {
    ok:true,
    message:item.name+
      " "+g.name+
      " tarafından kuşanıldı."
  };

}

function unequipItem(itemId){

  var item=getItem(itemId);

  if(!item){
    return {
      ok:false,
      message:"Eşya bulunamadı."
    };
  }

  if(item.marketLocked){
    return {
      ok:false,
      message:"Satıştaki eşya değiştirilemez."
    };
  }

  var oldOwner=item.equippedBy;

  item.equippedBy=null;

  if(oldOwner){

    var g=getGladiator(oldOwner);

    if(g){
      refreshOverall(g);
    }

  }

  saveState();

  return {
    ok:true,
    message:"Eşya envantere alındı."
  };

}

function stoneCount(
  color,
  key
){

  if(color==="blue"){

    return number(
      STATE.stones.sapphire[key],
      0
    );

  }

  if(color==="purple"){

    return number(
      STATE.stones.ruby[key],
      0
    );

  }

  return 0;

}

function changeStoneCount(
  color,
  key,
  amount
){

  if(color==="blue"){

    STATE.stones.sapphire[key]=
      Math.max(
        0,
        stoneCount("blue",key)+amount
      );

  }

  if(color==="purple"){

    STATE.stones.ruby[key]=
      Math.max(
        0,
        stoneCount("purple",key)+amount
      );

  }

}

function socketBlue(
  itemId,
  slotIndex,
  stoneKey
){

  var item=getItem(itemId);

  if(!item){
    return {
      ok:false,
      message:"Eşya bulunamadı."
    };
  }

  if(item.marketLocked){
    return {
      ok:false,
      message:"Satıştaki eşya geliştirilemez."
    };
  }

  if(
    slotIndex<0||
    slotIndex>3
  ){
    return {

    };
  }

  if(!BLUE_STONES[stoneKey]){
    return {

  if(
    stoneCount(
      "blue",
      stoneKey
    )<1
  ){
    return {
      ok:false,
      message:"Bu Safir envanterde yok."
    };
  }

  var previous=
    item.blueSlots[slotIndex];

  if(previous){
    changeStoneCount(

      1
    );
  }

  item.blueSlots[slotIndex]=
    stoneKey;

  changeStoneCount(
    "blue",
    stoneKey,

  );

  if(item.equippedBy){

    var g=getGladiator(
      item.equippedBy
    );

    if(g){
      refreshOverall(g);

  }

  saveState();

  return {
    ok:true,
    message:
      BLUE_STONES[stoneKey].name+
      " eşyaya basıldı."

/* =========================================================
   ENHANCEMENT ENGINE
========================================================= */

function enhancementRules(item){

  var risky=item.plus>=5;

  var felix=
    stoneCount(
      "blue",
      "felix"
    )>0;

  var tenax=
    stoneCount(
      "blue",
      "tenax"
    )>0;

  return {

    risky:risky,

    successChance:
      risky
        ?70+(felix?5:0)
        :100,

    destructionChance:
      risky
        ?20
        :0,

    diamondCost:1,

    felixAvailable:felix,

    tenaxAvailable:tenax

  };

}

function enhanceItem(itemId){

  var item=getItem(itemId);

  if(!item){
    return {
      ok:false,
      message:"Eşya bulunamadı."
    };
  }

  if(item.marketLocked){
    return {
      ok:false,
      message:"Satıştaki eşya geliştirilemez."
    };
  }

  if(item.destroyed){
    return {
      ok:false,
      message:"Yok edilmiş eşya geliştirilemez."
    };
  }

  var rules=
    enhancementRules(item);

  if(
    STATE.stones.diamond<
    rules.diamondCost
  ){
    return {
      ok:false,
      message:"Geliştirme için Elmas yetersiz."
    };
  }

  var txId=id("enhance");

  return runTransaction(
    txId,
    function(){

      STATE.stones.diamond-=
        rules.diamondCost;

      if(
        rules.risky&&
        rules.felixAvailable
      ){

        changeStoneCount(
          "blue",
          "felix",
          -1
        );

      }

      var success=
        chance(
          rules.successChance
        );

      if(success){

        applyEnhancedStats(
          item,
          item.plus+1
        );

        if(item.equippedBy){

          var owner=
            getGladiator(
              item.equippedBy
            );

          if(owner){
            refreshOverall(owner);
          }

        }

        return {
          result:"success",
          itemId:item.id,
          newPlus:item.plus
        };

      }

      var destroyed=
        rules.risky&&
        chance(
          rules.destructionChance
        );

      if(destroyed){

        if(rules.tenaxAvailable){

          changeStoneCount(
            "blue",
            "tenax",
            -1
          );

          return {
            result:"tenax_saved",
            itemId:item.id
          };

        }

        item.destroyed=true;

        var oldOwner=
          item.equippedBy;

        item.equippedBy=null;

        item.blueSlots=[
          null,
          null,
          null,
          null
        ];

        item.purpleSlots=[
          null,
          null
        ];

        if(oldOwner){

          var g=getGladiator(
            oldOwner
          );

          if(g){
            refreshOverall(g);
          }

        }

        return {
          result:"destroyed",
          itemId:item.id
        };

      }

      return {
        result:"failed",

/* =========================================================
   TRAINING ACTIVITY ENGINE
========================================================= */

function startTraining(
  gladiatorId,
  trainingKey
){

  var g=getGladiator(
    gladiatorId
  );

  var plan=
    TRAINING_TYPES[
      trainingKey
    ];

  if(!g||!plan){
    return {
      ok:false,
      message:"Antrenman başlatılamadı."
    };
  }

  if(!isGladiatorAvailable(g)){
    return {
      ok:false,
      message:
        g.name+
        " şu anda "+
        activityLabel(g.status)+
        "."
    };
  }

  if(
    g.condition<
    plan.condition
  ){
    return {
      ok:false,
      message:"Antrenman için kondisyon yetersiz."
    };
  }

  var durationMs=
    plan.durationMinutes*
    60*
    1000;

  var activity={

    id:id("training"),

    gladiatorId:g.id,

    type:trainingKey,

    startedAt:now(),

    endsAt:now()+durationMs,

    completed:false

  };

  g.status="training";
  g.activity=activity.id;
  g.lastActiveDay=dayKey();

  STATE.training.active.push(
    activity
  );

  saveState();

  return {
    ok:true,
    activity:activity,
    message:
      g.name+
      " "+plan.name+
      " antrenmanına başladı."
  };

}

function finishTraining(activity){

  if(!activity||activity.completed){
    return false;
  }

  var g=getGladiator(
    activity.gladiatorId
  );

  var plan=
    TRAINING_TYPES[
      activity.type
    ];

  if(!g||!plan){
    return false;
  }

  var gain=
    plan.gainPercent/100;

  if(plan.stat==="attack"){

    g.stats.attack=
      Math.round(
        g.stats.attack*
        (1+gain)
      );

  }

  if(plan.stat==="defense"){

    g.stats.defense=
      Math.round(
        g.stats.defense*
        (1+gain)
      );

  }

  if(plan.stat==="stamina"){

    g.stats.stamina=
      Math.round(
        g.stats.stamina*
        (1+gain)
      );

  }

  if(plan.stat==="agility"){

    g.stats.agility=
      Math.round(
        g.stats.agility*
        (1+gain)
      );

  }

  g.condition=
    Math.max(
      0,
      g.condition-
      plan.condition
    );

  g.fatigue=
    Math.min(
      100,
      g.fatigue+
      plan.fatigue
    );

  g.status="ready";
  g.activity=null;
  g.lastActiveDay=dayKey();

  activity.completed=true;

  STATE.ludus.exp+=150;

  refreshOverall(g);

  STATE.messages.unshift({

    id:id("msg"),

    type:"system",

    title:"Antrenman Tamamlandı",

    body:
      g.name+
      " · "+
      plan.name+
      " tamamlandı.",

    read:false,

    createdAt:now()

  });

  return true;

}

function processTraining(){

  var changed=false;
  var current=now();

  STATE.training.active.forEach(
    function(activity){

      if(
        !activity.completed&&
        current>=activity.endsAt
      ){

        if(
          finishTraining(
            activity
          )
        ){
          changed=true;
        }

      }

    }
  );

  STATE.training.active=
    STATE.training.active.filter(
      function(activity){
        return !activity.completed;
      }
    );

  if(changed){
    saveState();
  }

}

/* =========================================================
   QUEST ACTIVITY ENGINE
========================================================= */

function startQuest(
  questId,
  gladiatorId
){

  var template=findById(
    STATE.quests.available,
    questId
  );

  var g=getGladiator(
    gladiatorId
  );

  if(!template||!g){

    return {
      ok:false,
      message:"Görev başlatılamadı."
    };

  }

  if(!isGladiatorAvailable(g)){

    return {
      ok:false,
      message:
        g.name+
        " şu anda "+
        activityLabel(g.status)+
        "."
    };

  }

  if(
    g.condition<
    template.conditionCost
  ){

    return {
      ok:false,
      message:"Görev için kondisyon yetersiz."
    };

  }

  var active={

    id:id("quest"),

    templateId:template.id,

    gladiatorId:g.id,

    startedAt:now(),

    endsAt:
      now()+
      template.durationHours*
      60*
      60*
      1000,

    resolved:false

  };

  g.status="quest";
  g.activity=active.id;
  g.lastActiveDay=dayKey();

  STATE.quests.active.push(
    active
  );

  saveState();

  return {
    ok:true,
    activity:active,
    message:
      g.name+
      " göreve gönderildi."
  };

}

function resolveQuest(active){

  if(!active||active.resolved){
    return false;
  }

  var template=findById(
    STATE.quests.available,
    active.templateId
  );

  var g=getGladiator(
    active.gladiatorId
  );

  if(!template||!g){
    return false;
  }

  var power=
    g.overall+
    g.skillLevel*.7+
    g.passiveLevel*.5;

  var successChance=
    clamp(
      70+
      (power-template.difficulty)*.8,
      20,
      95
    );

  var success=
    chance(
      successChance
    );

  g.condition=
    Math.max(
      0,
      g.condition-
      template.conditionCost
    );

  g.fatigue=
    Math.min(
      100,
      g.fatigue+
      template.fatigue
    );

  var result={

    id:id("quest_result"),

    questId:template.id,

    questName:template.name,

    gladiatorId:g.id,

    gladiatorName:g.name,

    success:success,

    completedAt:now(),

    rewards:{
      gold:0,
      exp:0,
      sapphire:0,
      ruby:0,
      diamond:0
    },

    injuryLevel:0

  };

  if(success){

    result.rewards=
      clone(
        template.rewards
      );

    STATE.gold+=
      template.rewards.gold;

    STATE.ludus.exp+=
      template.rewards.exp;

    /* Görev EXP'si günlük antrenman gelişimi yerine sayılır. */

    g.exp+=
      template.rewards.exp;

    if(template.rewards.sapphire>0){

      STATE.stones.sapphire.extra_hp+=
        template.rewards.sapphire;

    }

    if(template.rewards.ruby>0){

      STATE.stones.ruby.team_skill_power+=
        template.rewards.ruby;

    }

    if(template.rewards.diamond>0){

      STATE.stones.diamond+=
        template.rewards.diamond;

    }

    STATE.quests.completedToday++;

  }else{

    var injuryRisk=
      clamp(
        5+
        g.fatigue*.45+
        (
          template.risk==="Yüksek"
            ?18
            :template.risk==="Orta"
            ?9
            :0
        ),
        5,
        65
      );

    if(chance(injuryRisk)){

      var injury=
        template.risk==="Yüksek"
          ?randomInt(2,4)
          :randomInt(1,2);

      g.injuryLevel=
        clamp(
          injury,
          1,
          5
        );

      result.injuryLevel=
        g.injuryLevel;

    }

  }

  if(g.injuryLevel>0){

    g.status="injured";

  }else{

    g.status="ready";

  }

  g.activity=null;
  g.lastActiveDay=dayKey();

  active.resolved=true;

  STATE.quests.history.unshift(
    result
  );

  STATE.messages.unshift({

    id:id("msg"),

    type:"system",

    title:
      success
        ?"Görev Tamamlandı"
        :"Görev Başarısız",

    body:
      g.name+
      " · "+
      template.name,

    read:false,

    createdAt:now()

  });

  return true;

}

function processQuests(){

  var changed=false;
  var current=now();

  STATE.quests.active.forEach(
    function(active){

      if(
        !active.resolved&&
        current>=active.endsAt
      ){

        if(
          resolveQuest(
            active
          )
        ){
          changed=true;
        }

      }

    }
  );

  STATE.quests.active=
    STATE.quests.active.filter(
      function(active){
        return !active.resolved;
      }
    );

  if(changed){
    saveState();
  }

}

/* =========================================================
   INACTIVITY RULE
========================================================= */

function processDailyReset(){

  var today=dayKey();

  if(
    STATE.daily.day===
    today
  ){
    return;
  }

  STATE.gladiators.forEach(
    function(g){

      if(
        g.lastActiveDay!==
        STATE.daily.day
      ){

        var possible=[
          "hp",
          "stamina",
          "agility",
          "attack",
          "defense"
        ];

        var key=
          possible[
            randomInt(
              0,
              possible.length-1
            )
          ];

        g.stats[key]=
          Math.max(
            1,
            Math.round(
              g.stats[key]*.99
            )
          );

        refreshOverall(g);

      }

  });

  STATE.daily.day=today;
  STATE.daily.inactivityProcessed=true;

  STATE.quests.completedToday=0;

  saveState();

}

/* =========================================================
   REST / TREATMENT
========================================================= */

function restGladiator(gladiatorId){

  var g=getGladiator(
    gladiatorId
  );

  if(!g){
    return {
      ok:false,
      message:"Gladyatör bulunamadı."
    };
  }

  if(
    g.status==="training"||
    g.status==="quest"||
    g.status==="guild_locked"
  ){

    return {
      ok:false,
      message:
        g.name+
        " şu anda dinlenemez."
    };

  }

  var regen=
    15+
    STATE.ludus.rooms.beds*3+
    STATE.ludus.staff.coquus*2;

  g.condition=
    Math.min(
      g.conditionMax,
      g.condition+regen
    );

  g.fatigue=
    Math.max(
      0,
      g.fatigue-regen
    );

  if(
    g.injuryLevel===0
  ){
    g.status="ready";
  }

  saveState();

  return {
    ok:true,
    message:
      g.name+
      " dinlendi."
  };

}

function treatGladiator(gladiatorId){

  var g=getGladiator(
    gladiatorId
  );

  if(!g){
    return {
      ok:false,
      message:"Gladyatör bulunamadı."
    };
  }

  if(g.injuryLevel<=0){

    return {
      ok:false,
      message:"Gladyatör sakat değil."
    };

  }

  var cost=
    g.injuryLevel*
    15000;

  if(STATE.gold<cost){

    return {
      ok:false,
      message:"Tedavi için altın yetersiz."
    };

  }

  STATE.gold-=cost;

  var heal=
    Math.max(
      1,
      Math.floor(
        STATE.ludus.staff.medicus/3
      )
    );

  g.injuryLevel=
    Math.max(
      0,
      g.injuryLevel-heal
    );

  if(g.injuryLevel===0){
    g.status="ready";
  }

  saveState();

  return {
    ok:true,
    message:
      g.injuryLevel===0
        ?g.name+" tamamen iyileşti."
        :"Sakatlık seviyesi düştü."
  };

}

function trainingDurationLabel(minutes){

  var h=Math.floor(
    minutes/60
  );

  var m=minutes%60;

  if(h&&m){
    return h+"s "+m+"dk";
  }

  if(h){
    return h+"s";
  }

  return m+"dk";

}

window.selectTraining=function(key){

  if(TRAINING_TYPES[key]){
    UI.selectedTraining=key;
    render();

};

    stats.attackMax

        formatNumber(
          stats.attackMin
        )+
        "–"+
        formatNumber(
          stats.attackMax
        )
      )
    );
  }

  if(
    stats.defenseMin||
    stats.defenseMax
  ){
    rows.push(
      statRow(
        "Physical Defense",
        formatNumber(
          stats.defenseMin
        )+
        "/"+
        formatNumber(
          stats.defenseMax
        )
      )
    );
  }

  if(stats.critical){
    rows.push(
      statRow(
        "Critical",
        stats.critical
      )
    );
  }

  if(stats.criticalResistance){
    rows.push(
      statRow(
        "Critical Resistance",
        "%"+
        stats.criticalResistance
      )
    );
  }

  if(stats.attackRate){
    rows.push(
      statRow(
        "Attack Rate",
        stats.attackRate
      )
    );
  }

  if(stats.blockRate){
    rows.push(
      statRow(
        "Block Rate",
        stats.blockRate
      )
    );
  }

  return rows.join("");

}

function render(){

  APP_STAGE=
    "render:"+UI.page;

  processTraining();
  processQuests();

  updateHeader();

  if(DOM.overlay){
    DOM.overlay.innerHTML="";
  }

  var navButtons=
    DOM.nav
      ?DOM.nav.querySelectorAll(
        "button[data-page]"
      )
      :[];

  for(
    var i=0;
    i<navButtons.length;
    i++
  ){

    navButtons[i].classList.toggle(
      "active",
      navButtons[i].getAttribute(
        "data-page"
      )===UI.page
    );

  }

  var views={

    home:viewHome,

    ludus:viewLudus,

    gladiators:viewGladiators,

      viewGladiatorDetail,

    training:viewTraining,

    inventory:viewInventory,

        "Basit, Tehlikeli ve Gizli görev sistemi."
      );

    market:function(){
      return coming(
        "Pazar",
        "Gladyatör ve Ekipman pazarı. Taş pazarı bulunmaz."
      );

    arena:function(){

        "Arena",
        "Ranked 5v5 ve Imperial Arena."
      );
    },

    messages:function(){
      return coming(
        "Mesajlar",
        "Sistem ve Guild mesajları."
      );
    },

      );
    },

    menu:function(){
      return coming(

function fatal(error){

  var target=
    document.getElementById(
      "game"
    );

  if(!target) return;

  target.innerHTML=`
    <section class="card error-card">

      <h3>
        BUILD C Başlatma Hatası
      </h3>

      <p>
        <b>Aşama:</b>
        ${escapeHTML(APP_STAGE)}
      </p>

      <p>
        <b>Hata:</b>
        ${escapeHTML(
          error&&error.message
            ?error.message
            :error
        )}
      </p>

      <button
        class="btn danger"
        onclick="resetBuildC()">
        BUILD C Kaydını Sıfırla
      </button>

    </section>
  `;

}

window.resetBuildC=function(){

  try{
    localStorage.removeItem(
      SAVE_KEY
    );
  }catch(e){}

  location.reload();

};

function boot(){

  APP_STAGE="dom";

  DOM={

    game:
      document.getElementById(
        "game"
      ),

    nav:
      document.getElementById(
        "bottomNav"
      ),

    toast:
      document.getElementById(
        "toast"
      ),

    overlay:
      document.getElementById(
        "overlay"
      ),

    gold:
      document.getElementById(
        "topGold"
      ),

    diamond:
      document.getElementById(
        "topDiamond"
      ),

    sapphire:
      document.getElementById(
        "topSapphire"
      ),

    ruby:
      document.getElementById(
        "topRuby"
      ),

    exp:
      document.getElementById(
        "topExp"
      ),

    gladiators:
      document.getElementById(
        "topGladiators"
      ),

    level:
      document.getElementById(
        "topLevel"
      ),

    rating:
      document.getElementById(
        "topRating"
      )

  };

  if(
    !DOM.game||
    !DOM.nav
  ){

    throw new Error(
      "Ana arayüz elemanları bulunamadı."
    );

  }

  APP_STAGE="state";

  STATE=loadState();

  APP_STAGE="daily";

  processDailyReset();

  if(
    !UI.selectedGladiatorId&&
    STATE.gladiators[0]
  ){

    UI.selectedGladiatorId=
      STATE.gladiators[0].id;

  }

  APP_STAGE="events";

  DOM.nav.addEventListener(
    "click",
    function(event){

      var node=event.target;

      while(
        node&&
        node!==DOM.nav&&
        !node.getAttribute(
          "data-page"
        )
      ){
        node=node.parentNode;
      }

      if(
        node&&
        node.getAttribute
      ){

        var page=
          node.getAttribute(
            "data-page"
          );

        if(page){
          setPage(page);
        }

      }

    }
  );

  APP_STAGE="save";

  saveState();

  APP_STAGE="render";

  render();

  APP_STAGE="ready";

}

window.onerror=function(
  message,
  source,
  line,
  column,
  error
){

  fatal(
    error||
    new Error(
      String(message)+
      " @"+
      line+
      ":"+
      column
    )
  );

  return false;

};

try{

  boot();

}catch(error){

  fatal(error);

}
