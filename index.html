<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colosseum & Ludus — B2.1</title>
<style>
:root{--red:#681923;--dark:#350b10;--gold:#c99a3d;--cream:#f2e8d2;--paper:#fffaf0;--ink:#2d1c15;--line:#d5bf94;--green:#2d7445;--blue:#286b9f;--purple:#743985}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#170d0b}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);padding-bottom:76px}
button,input,select{font:inherit}
#app{max-width:760px;margin:auto;min-height:100vh;background:var(--cream)}
header{position:sticky;top:0;z-index:50;background:linear-gradient(145deg,var(--dark),var(--red));color:#fff;border-bottom:3px solid var(--gold);padding:10px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:18px;margin:0;letter-spacing:1px}.brand small{color:#ead6a2}
.build{font-size:9px;border:1px solid var(--gold);border-radius:10px;padding:2px 6px;margin-left:5px}
.resources{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.resource{text-align:center;font-size:9px;padding:5px 1px;border:1px solid #b88b37;border-radius:6px;background:#ffffff0d}
main{padding:12px;min-height:650px}
.hero{background:linear-gradient(145deg,#832c35,#3a0d12);border:2px solid var(--gold);border-radius:13px;color:#fff;padding:16px;margin-bottom:10px;box-shadow:0 5px 14px #0003}
.hero h2{margin:0 0 5px;font-size:24px}.hero p{margin:4px 0;color:#ecd9aa}
.card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0;box-shadow:0 2px 7px #42200e18}
.card h3{margin:0 0 8px;color:var(--red)}
.row,.stat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{padding:7px 0;border-bottom:1px dashed #d9c8a9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{width:100%;border:0;border-radius:7px;padding:11px 7px;margin-top:6px;color:#fff;background:linear-gradient(#8d303a,#58141b);border-bottom:2px solid #351014}
.btn.gold{background:linear-gradient(#dfbd70,#a97721);color:#2b1909}
.btn.light{background:#eee1c8;color:#402a1c;border:1px solid #c8af7b}
.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}.btn.green{background:var(--green)}
.btn:disabled{opacity:.42}
.big{font-size:25px;font-weight:bold;color:var(--red)}
.muted{font-size:11px;color:#78685b}.good{color:var(--green);font-weight:bold}.bad{color:#a52a2a;font-weight:bold}
.gladiator{display:flex;align-items:center;gap:11px}
.avatar{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:36px;background:linear-gradient(#eadbb8,#a77d3c);border:3px solid #7b551e}
.bar{height:9px;background:#dfd1b8;border-radius:20px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#8f2933,#d3a448)}
.room{text-align:center;background:#f4e8d0;border:1px solid #cfb887;border-radius:8px;padding:10px 3px}
.room .ico{font-size:25px}.room b{display:block;font-size:11px;color:var(--red)}
.tag{display:inline-block;font-size:10px;padding:3px 6px;margin:2px;border-radius:20px;border:1px solid #cbb486;background:#eee1c6}
.blueTag{background:#e5f0f8;border-color:#6c99bc;color:#205c8e}
.purpleTag{background:#f0e5f4;border-color:#9d70a9;color:#6b3079}
.item{background:#f6eddb;border:1px solid #d8c398;border-radius:9px;padding:10px;margin:7px 0}
.sockets{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.socket{min-height:44px;padding:7px;border-radius:7px;font-size:10px;background:#fffaf0;border:1px dashed #b9a67e}
.socket.blue{border-color:#6795ba}.socket.purple{border-color:#9769a3}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:8px}
.tabs button{white-space:nowrap;border:1px solid #c6ae7a;background:#efe2c7;border-radius:20px;padding:7px 11px;color:#43291c}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fighter{text-align:center;font-size:9px;padding:7px 2px;background:#f2e5ca;border:1px solid #ccb481;border-radius:7px}
.fighter b{display:block;color:var(--red);font-size:10px}.fighter.pick{outline:3px solid var(--gold)}
.score{text-align:center;font-size:42px;font-weight:bold;color:var(--red);padding:10px}
.rankrow{display:grid;grid-template-columns:35px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #deceb0}
.medal{text-align:center;font-size:22px}
.message{padding:10px;margin:7px 0;border-left:4px solid var(--gold);background:#faf1df}.unread{background:#fff0c9}
.badge{min-height:85px;border-radius:10px;border:1px solid #c9a45a;background:#f5e8ca;text-align:center;padding:9px 3px;font-size:10px}
.badge span{display:block;font-size:28px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);background:#3a0d12;border-top:2px solid var(--gold);z-index:60}
.bottom button{background:none;border:0;color:#e6d2a8;padding:9px 1px;font-size:8px}
.bottom button span{display:block;font-size:18px}.bottom button.active{background:#77232c;color:#fff}
#toast{display:none;position:fixed;z-index:100;bottom:80px;left:50%;transform:translateX(-50%);width:min(92%,700px);background:#251311;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:11px}
#overlay:empty{display:none}
#overlay{position:fixed;inset:0;z-index:90;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--cream);border-radius:16px 16px 0 0;padding:15px;border-top:3px solid var(--gold)}
.error{border:2px solid #a52a2a;background:#fff1ed}
.lock{padding:8px;border:1px solid #b88b37;border-radius:7px;background:#fff3d7;margin:6px 0}
</style>
</head>

<body>
<div id="app">

<header>
<div class="brand">
<div>
<h1>COLOSSEUM & LUDUS <span class="build">B2.1</span></h1>
<small>Aurea Ludus · Roma</small>
</div>
<div style="text-align:right">
<b id="uiLevel">LV.12</b><br>
<small id="uiRating">1500 RP</small>
</div>
</div>

<div class="resources">
<div class="resource">🪙<br><b id="uiGold">—</b></div>
<div class="resource">💎<br><b id="uiDiamond">—</b></div>
<div class="resource">🔵<br><b id="uiSapphire">—</b></div>
<div class="resource">🟣<br><b id="uiRuby">—</b></div>
<div class="resource">⭐<br><b id="uiExp">—</b></div>
<div class="resource">⚔️<br><b id="uiCount">—</b></div>
</div>
</header>

<main id="gameView">
<section class="card">
<h3>B2.1 başlatılıyor…</h3>
<p class="muted">Oyun verileri kontrol ediliyor.</p>
</section>
</main>

<nav class="bottom" id="bottomNav">
<button data-page="ludus"><span>🏛️</span>LUDUS</button>
<button data-page="roster"><span>⚔️</span>KADRO</button>
<button data-page="arena"><span>🏟️</span>ARENA</button>
<button data-page="guild"><span>🚩</span>GUILD</button>
<button data-page="market"><span>🏺</span>PAZAR</button>
<button data-page="menu"><span>☰</span>MENÜ</button>
</nav>

<div id="toast"></div>
<div id="overlay"></div>
</div>

<script>
(function(){
"use strict";

var STAGE="boot";
var DOM={};
var S=null;
var page="ludus";
var equipmentIndex=0;
var marketTab="gladiator";
var messageTab="Sistem";
var rankedSelection=[];
var toastTimer=null;

var KEY="LUDUS_B21";
var OLD_KEYS=["LUDUS_B2","LUDUS_B1","LUDUS_A3","colosseum_pack1"];

var BLUE=[
"Extra HP +3%",
"HP Regen +2%",
"Kondisyon +3%",
"Kondisyon Regen +2%",
"Critical +3%",
"Block Rate +4%"
];

var PURPLE=[
"Team Skill Power +2%",
"Team Skill Trigger +2%",
"Team Passive Resistance +2%",
"Vanguard +2%",
"Mars +2%",
"Aegis +2%",
"Concordia +2%",
"Victoria +2%"
];

var CLASS_DATA={
Murmillo:{anti:"Retiarius",weak:"Hoplomachus",skill:"Scutum Bash",passive:"Fortis"},
Secutor:{anti:"Retiarius",weak:"Murmillo",skill:"Hunter's Rush",passive:"Pursuit"},
Hoplomachus:{anti:"Murmillo",weak:"Secutor",skill:"Spear Wall",passive:"Discipline"},
Retiarius:{anti:"Hoplomachus",weak:"Secutor",skill:"Net Trap",passive:"Evasion"}
};

function el(id){return document.getElementById(id)}

function num(v,f){
var n=Number(v);
return isFinite(n)?n:f;
}

function esc(v){
return String(v).replace(/[&<>"']/g,function(c){
return({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c];
});
}

function makeEquipment(){
return [
["Silah","Gladius",5],
["Kalkan","Scutum",3],
["Başlık","Galea",4],
["Zırh","Lorica",6],
["Kolluk","Manica",2],
["Bacaklık","Greaves",2]
].map(function(x){
return{
slot:x[0],
name:x[1],
plus:x[2],
blue:[null,null,null,null],
purple:[null,null],
destroyed:false
};
});
}

function makeGladiator(name,cls,lvl,ovr){
return{
name:name,
class:cls,
level:lvl,
ovr:ovr,
hp:1300+ovr*7,
stamina:500+lvl*9,
agility:110+lvl*3,
attack:1600+ovr*15,
defense:150+lvl*8,
crit:12,
critRes:10,
attackSpeed:400,
block:60,
condition:100,
fatigue:0,
injury:0,
skillLevel:4,
passiveLevel:4,
equipment:makeEquipment()
};
}

function fresh(){
return{
version:"B2.1",
gold:1250000,
diamond:10,
sapphire:18,
ruby:12,
exp:18400,
rating:1500,
level:12,
selected:0,

special:{
felix:3,
vesper:2,
tenax:2
},

rooms:{
training:2,
forge:2,
infirmary:1,
kitchen:1,
beds:2,
chest:2
},

staff:{
doctore:4,
faber:4,
medicus:3,
coquus:3,
custos:2
},

gladiators:[
makeGladiator("Aulus Varro","Murmillo",12,72),
makeGladiator("Cassius Nero","Secutor",8,64),
makeGladiator("Titus Flavius","Hoplomachus",7,61),
makeGladiator("Gaius Marcellus","Retiarius",8,63),
makeGladiator("Decimus Corvus","Murmillo",9,66)
],

arena:{
wins:0,
losses:0,
last:null
},

imperial:{
best:0,
played:0
},

guild:{
name:"Aurea Legio",
members:24,
max:30,
power:187420,
league:"III",
warWins:7,
warLosses:3,
locked:false,
lastWar:null
},

market:{
listed:false,
listingPrice:6250000,
purchased:{},
itemBought:{},
stoneBought:{}
},

messages:[
{
type:"Sistem",
title:"Aurea Ludus'a Hoş Geldin",
body:"Ludus yönetim merkezi hazır.",
read:false
},
{
type:"Guild",
title:"Aurea Legio",
body:"Guild War hazırlıkları başladı.",
read:false
}
],

badges:[
{name:"02/2027 Kupası Galibi",icon:"🏆"},
{name:"06/2027 Lig Şampiyonu",icon:"🏛️"},
{name:"100 Arena Zaferi",icon:"⚔️"}
],

transactions:{}
};
}

function normalizeEquipment(eq){
var base=makeEquipment();

if(!Array.isArray(eq)) return base;

return base.map(function(d,i){
var o=eq[i]||{};
var p=Array.isArray(o.purple)
?o.purple
:(Array.isArray(o.ruby)?o.ruby:[]);

return{
slot:o.slot||d.slot,
name:o.name||d.name,
plus:num(o.plus,d.plus),

blue:[
o.blue&&o.blue[0]||null,
o.blue&&o.blue[1]||null,
o.blue&&o.blue[2]||null,
o.blue&&o.blue[3]||null
],

purple:[
p[0]||null,
p[1]||null
],

destroyed:!!o.destroyed
};
});
}

function normalizeGladiator(o,d){
o=o||{};

var g=Object.assign({},d,o);

g.class=CLASS_DATA[g.class]?g.class:d.class;
g.equipment=normalizeEquipment(o.equipment);

g.condition=Math.max(0,Math.min(100,num(g.condition,100)));
g.fatigue=Math.max(0,Math.min(100,num(g.fatigue,0)));
g.injury=Math.max(0,Math.min(5,num(g.injury,0)));

return g;
}

function normalize(raw){
var b=fresh();
var o=Object.assign({},b,raw||{});

o.special=Object.assign({},b.special,raw&&raw.special||{});
o.rooms=Object.assign({},b.rooms,raw&&raw.rooms||{});

o.staff={};

Object.keys(b.staff).forEach(function(k){
var v=raw&&raw.staff?raw.staff[k]:null;

if(v&&typeof v==="object") v=v.level;

o.staff[k]=num(v,b.staff[k]);
});

var inc=raw&&Array.isArray(raw.gladiators)
?raw.gladiators
:[];

o.gladiators=b.gladiators.map(function(d,i){
return normalizeGladiator(inc[i],d);
});

if(inc.length>b.gladiators.length){
inc.slice(b.gladiators.length).forEach(function(g){
o.gladiators.push(
normalizeGladiator(
g,
makeGladiator(
g.name||"Gladyatör",
CLASS_DATA[g.class]?g.class:"Murmillo",
num(g.level,1),
num(g.ovr,50)
)
)
);
});
}

o.arena=Object.assign({},b.arena,raw&&raw.arena||{});
o.imperial=Object.assign({},b.imperial,raw&&raw.imperial||{});

o.guild=Object.assign({},b.guild,raw&&raw.guild||{});
o.guild.max=30;

o.market=Object.assign({},b.market,raw&&raw.market||{});

o.market.purchased=Object.assign(
{},
b.market.purchased,
o.market.purchased||{}
);

o.market.itemBought=Object.assign(
{},
b.market.itemBought,
o.market.itemBought||{}
);

o.market.stoneBought=Object.assign(
{},
b.market.stoneBought,
o.market.stoneBought||{}
);

o.messages=Array.isArray(raw&&raw.messages)
?raw.messages
:b.messages;

o.badges=Array.isArray(raw&&raw.badges)
?raw.badges
:b.badges;

o.transactions=
(raw&&raw.transactions&&typeof raw.transactions==="object")
?raw.transactions
:{};

o.selected=Math.max(
0,
Math.min(
o.gladiators.length-1,
num(o.selected,0)
)
);

o.version="B2.1";

return o;
}

function safeStorageGet(k){
try{
return localStorage.getItem(k);
}catch(e){
return null;
}
}

function load(){
STAGE="load";

var raw=null;
var src="new";

var txt=safeStorageGet(KEY);

if(txt){
try{
raw=JSON.parse(txt);
src=KEY;
}catch(e){
raw=null;
}
}

if(!raw){
for(var i=0;i<OLD_KEYS.length;i++){

txt=safeStorageGet(OLD_KEYS[i]);

if(txt){
try{
raw=JSON.parse(txt);
src=OLD_KEYS[i];
break;
}catch(e){}
}

}
}

var out=normalize(raw||{});
out.migratedFrom=src;

return out;
}

function save(){
STAGE="save";

try{
localStorage.setItem(KEY,JSON.stringify(S));
}catch(e){}

updateTop();
}

function tx(id,fn){
if(S.transactions[id]) return false;

fn();

S.transactions[id]=Date.now();

save();

return true;
}

function fmt(v){
return num(v,0).toLocaleString("tr-TR");
}

function selected(){
return S.gladiators[S.selected];
}

function stat(a,b){
return '<div class="stat"><span>'+a+'</span><b>'+b+'</b></div>';
}

function icon(c){
return({
Murmillo:"🛡️",
Secutor:"⚔️",
Hoplomachus:"🔱",
Retiarius:"🕸️"
})[c]||"⚔️";
}

function updateTop(){
if(!DOM.gold) return;

DOM.gold.textContent=fmt(S.gold);
DOM.diamond.textContent=S.diamond;
DOM.sapphire.textContent=S.sapphire;
DOM.ruby.textContent=S.ruby;
DOM.exp.textContent=fmt(S.exp);
DOM.count.textContent=S.gladiators.length;
DOM.level.textContent="LV."+S.level;
DOM.rating.textContent=S.rating+" RP";
}

function toast(t){
DOM.toast.textContent=t;
DOM.toast.style.display="block";

clearTimeout(toastTimer);

toastTimer=setTimeout(function(){
DOM.toast.style.display="none";
},2200);
}

function closeOverlay(){
DOM.overlay.innerHTML="";
}

window.closeOverlay=closeOverlay;

function setPage(p){
page=p;
render();
window.scrollTo(0,0);
}

window.go=setPage;

function roomTile(i,n,l){
return '<div class="room"><div class="ico">'+i+'</div><b>'+n+'</b><small>Lv.'+l+'</small></div>';
}

function viewLudus(){
return `
<section class="hero">
<h2>Aurea Ludus</h2>
<p>Roma · Ludus Seviyesi ${S.level}</p>
<p>Gladyatörlerini geliştir, ekonomini yönet ve arenada yüksel.</p>
</section>

<div class="card">
<h3>Gladyatörler</h3>
${S.gladiators.slice(0,5).map(function(g,i){
return `
<div class="stat" onclick="selectGladiator(${i})">
<span>${esc(g.name)}<br><small class="muted">${esc(g.class)}</small></span>
<b>OVR ${g.ovr}</b>
</div>`;
}).join("")}
</div>

<div class="card">
<h3>Ludus Bölümleri</h3>

<div class="grid3">
${roomTile("⚔️","Eğitim",S.rooms.training)}
${roomTile("🔨","Atölye",S.rooms.forge)}
${roomTile("⚕️","Revir",S.rooms.infirmary)}
${roomTile("🍖","Mutfak",S.rooms.kitchen)}
${roomTile("🛏️","Yatak",S.rooms.beds)}
${roomTile("📦","Sandık",S.rooms.chest)}
</div>
</div>

<div class="grid2">
<button class="btn" onclick="go('quest')">📜 Görevler</button>
<button class="btn gold" onclick="go('arena')">🏟️ Arena</button>
<button class="btn light" onclick="go('staff')">👥 Çalışanlar</button>
<button class="btn light" onclick="go('rooms')">🏛️ Ludus Geliştir</button>
</div>
`;
}

function viewRoster(){
return `
<section class="hero">
<h2>Gladyatörler</h2>
<p>${S.gladiators.length} savaşçı</p>
</section>

${S.gladiators.map(function(g,i){
return `
<div class="card" onclick="selectGladiator(${i})">

<div class="gladiator">

<div class="avatar">${icon(g.class)}</div>

Yorgunluk ${g.fatigue}%
</div>

</div>
</div>
</div>
`;
}).join("")}
`;
}

window.selectGladiator=function(i){
S.selected=i;
save();
setPage("gladiator");
};

function viewGladiator(){

var c=CLASS_DATA[g.class];

return `
<section class="hero">

<div class="gladiator">

<div class="avatar">${icon(g.class)}</div>

<b style="font-size:29px">OVR ${g.ovr}</b>

</div>

<div class="card">

<div class="grid2">

var p=g.equipment.reduce(function(a,e){
return a+(e.destroyed?0:e.plus);
},0);

g.ovr=Math.max(
1,
Math.min(
100,
Math.round(
g.level*2.2+
p*.55+
g.attack/180+
g.defense/40
)
)
);
}

);

function fatal(e){

var v=el("gameView");

if(v){

v.innerHTML=`
<section class="card error">

<h3>B2.1 Başlatma Hatası</h3>

<p>
<b>Aşama:</b>
${esc(STAGE)}

${esc(
e&&e.message
?e.message
:e
)}
</p>

<button class="btn"
onclick="resetB21()">
B2.1 Kaydını Sıfırla
</button>

</section>
`;

}

try{
console.error(e);
}catch(x){}
}

window.resetB21=function(){

try{
localStorage.removeItem(KEY);
}catch(e){}

location.reload();
};

function boot(){

STAGE="dom";

DOM={
view:el("gameView"),
overlay:el("overlay"),
toast:el("toast"),
nav:el("bottomNav"),
gold:el("uiGold"),
diamond:el("uiDiamond"),
sapphire:el("uiSapphire"),
ruby:el("uiRuby"),
exp:el("uiExp"),
count:el("uiCount"),
level:el("uiLevel"),
rating:el("uiRating")
};

if(!DOM.view||!DOM.nav){

throw new Error(
"Ana arayüz elemanları bulunamadı."
);

}

STAGE="events";

DOM.nav.addEventListener(
"click",
function(e){

var b=
e.target.closest
?e.target.closest(
"button[data-page]"
)
:null;

if(b){

setPage(
b.getAttribute("data-page")
);

}

}
);

STAGE="state";

S=load();

STAGE="initial-save";

save();

STAGE="initial-render";

render();

STAGE="ready";
}

window.onerror=function(
msg,
src,
line,
col,
err
){

fatal(
err||
new Error(
String(msg)+
" @"+
line+
":"+
col
)
);

return false;
};

try{

boot();

}catch(e){

fatal(e);

}

})();
</script>
