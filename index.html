<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#65130f">
<title>Colosseum & Ludus — BUILD C4</title>

<style>
:root{
  --red:#71150f;
  --red2:#4d0d0a;
  --gold:#d7a63c;
  --gold2:#f1d27c;
  --cream:#f5ead2;
  --paper:#fff8e8;
  --ink:#302116;
  --blue:#1469d8;
  --ruby:#c51f45;
  --green:#287f47;
  --dark:#231810;
  --shadow:0 5px 18px #0004;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#d9c49b;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input,select{font:inherit}
button{cursor:pointer}
body{
  background:
  radial-gradient(circle at 50% 0,#fff8d9aa,transparent 40%),
  linear-gradient(135deg,#d8bd87,#f7ebce 48%,#cba96e);
}
#app{min-height:100vh}
.top{
  height:58px;background:linear-gradient(#771812,#4f0d0b);
  border-bottom:3px solid var(--gold);
  color:#ffe6a2;display:flex;align-items:center;
  position:fixed;top:0;left:160px;right:0;z-index:50;
  box-shadow:0 2px 10px #0006;
}
.brand{font-size:25px;font-weight:bold;padding:0 28px;white-space:nowrap}
.resources{margin-left:auto;display:flex;gap:18px;align-items:center;padding-right:22px;font-size:16px}
.res{display:flex;align-items:center;gap:6px;white-space:nowrap}
.res b{font-size:19px}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:160px;z-index:60;
  background:linear-gradient(90deg,#4a0d0a,#72150f 70%,#410907);
  border-right:3px solid #b88728;color:#f8e6b4;box-shadow:4px 0 12px #0005
}
.logo{
  height:70px;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid #bd8d36;font-size:35px;color:#e6bd57
}
.nav{padding-top:10px}
.nav button{
  width:100%;height:56px;border:0;border-bottom:1px solid #8e4d2b;
  background:transparent;color:#f7e4b5;text-align:left;padding:0 13px;
  font-size:15px;display:flex;gap:10px;align-items:center
}
.nav button:hover,.nav button.active{
  color:#341b0b;background:linear-gradient(90deg,#f5d993,#fff1c5);
  font-weight:bold
}
.nav .ico{width:26px;text-align:center;font-size:21px}
.main{margin-left:160px;padding-top:58px;min-height:100vh}
.page{
  min-height:calc(100vh - 58px);
  padding:22px;
  background:
  linear-gradient(#ffffff25,#ffffff25),
  radial-gradient(circle at 80% 20%,#fff8d4,transparent 32%),
  linear-gradient(135deg,#d8bb7d,#f5e8c9 55%,#d4b170);
}
.banner{
  width:max-content;max-width:100%;margin:0 auto 18px;
  padding:10px 48px;background:linear-gradient(#8b1c14,#5c0e0a);
  color:#ffe4a0;border:3px solid #c49a43;border-radius:4px;
  font-size:32px;font-weight:bold;text-align:center;box-shadow:var(--shadow)
}
.panel{
  background:linear-gradient(#fffaf0,#f3e4c7);
  border:2px solid #b88b45;border-radius:8px;box-shadow:var(--shadow);
  padding:16px
}
.panel h2,.panel h3{margin:0 0 12px}
.grid{display:grid;gap:14px}
.cols2{grid-template-columns:1fr 1fr}
.cols3{grid-template-columns:1fr 1fr 1fr}
.btn{
  border:2px solid #a77c32;border-radius:5px;
  padding:10px 16px;background:linear-gradient(#8b1b14,#5c0d09);
  color:#ffe6a8;font-weight:bold;box-shadow:0 2px 5px #0003
}
.btn.gold{background:linear-gradient(#f6dfa1,#c79639);color:#38200b}
.btn.green{background:linear-gradient(#37985a,#176b39);color:white}
.btn.dark{background:linear-gradient(#514238,#211912);color:#fff2d2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:#66513a}
.muted{color:#806c55}
.good{color:#18783a;font-weight:bold}
.bad{color:#a61c18;font-weight:bold}
.blue{color:#075ebd}
.ruby{color:#b3163b}
.hr{height:1px;background:#c9a96b;margin:12px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{
  background:linear-gradient(#fffaf0,#ead7b5);
  border:2px solid #b88b45;border-radius:6px;padding:12px;box-shadow:0 2px 7px #0002
}
.card.selected{outline:4px solid #e0ad38;box-shadow:0 0 15px #e2a72c}
.card h3{margin:4px 0}
.badge{
  display:inline-block;padding:3px 7px;border-radius:4px;background:#eee1c4;border:1px solid #ad8a4c
}
.statrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #dac9a7}
.tabs{display:flex;gap:4px;overflow:auto;margin-bottom:12px}
.tabs button{
  min-width:110px;border:1px solid #b18b51;background:#efe0c1;padding:10px;border-radius:4px
}
.tabs button.active{background:#71150f;color:#ffe8ad;border-color:#d5a847}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff8e9}
th{background:#5d130f;color:#ffe5a0}
td,th{padding:8px;border:1px solid #cdb88e;text-align:left}
.topline{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input,select{
  padding:9px;border:1px solid #aa8d61;border-radius:4px;background:#fffaf0;color:#302116
}
.progress{height:13px;border:1px solid #8c713f;background:#d6c6a7;border-radius:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#7e1711,#e2aa37)}
.status-ready{color:#18783a}
.status-busy{color:#a06a08}
.status-injured{color:#b11818}
.resourceBig{font-size:20px;font-weight:bold}
.bottomnav{display:none}
.modal{
  position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px
}
.modalbox{
  width:min(760px,96vw);max-height:90vh;overflow:auto;
  background:#f8ecd3;border:4px solid #b88b45;border-radius:8px;padding:20px;box-shadow:0 15px 60px #000
}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:120;background:#2d2017;color:#fff1cc;
  border:2px solid #d1a74e;padding:12px 18px;border-radius:6px;box-shadow:var(--shadow)
}
.hero{
  min-height:220px;border:2px solid #b88b45;border-radius:8px;padding:22px;
  background:linear-gradient(90deg,#ffffffdf,#fff8e5bb),linear-gradient(135deg,#b87c42,#f3d79c);
  box-shadow:var(--shadow)
}
.quick{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px
}
.quick .card{cursor:pointer;text-align:center}
.quick .big{font-size:29px;font-weight:bold;color:#761610}
.roster{display:flex;gap:8px;overflow:auto;padding:8px 2px}
.fighter{
  min-width:130px;text-align:center;background:#f6e8ca;border:2px solid #b98a40;border-radius:6px;padding:9px;cursor:pointer
}
.fighter.selected{background:#fff3bd;outline:3px solid #d9a430}
.avatar{
  width:62px;height:62px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#7d1b13,#32110d);color:#f4cf6a;font-size:30px;border:2px solid #c99d46
}
.stone{
  text-align:center;min-height:110px;cursor:pointer
}
.stone .gem{font-size:35px}
.itemicon{font-size:38px;text-align:center;margin:8px}
.quest{
  min-height:300px;display:flex;flex-direction:column
}
.quest .pic{
  height:105px;background:linear-gradient(135deg,#294e52,#c4874a);
  border:2px solid #8d6837;margin-bottom:10px;display:flex;align-items:center;justify-content:center;
  font-size:50px
}
.guildwar{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px}
.memberrow{display:grid;grid-template-columns:30px 1fr 70px 70px;gap:5px;align-items:center;padding:5px;border-bottom:1px solid #d3bf98}
.wargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.warunit{background:#f4e4c6;border:1px solid #a78650;text-align:center;padding:5px;font-size:12px}
.chat{display:grid;grid-template-columns:28% 46% 26%;min-height:590px}
.chat>div{border-right:1px solid #bca376;padding:12px}
.msg{background:#fff8e8;border:1px solid #c9b186;padding:9px;margin:8px 0;border-radius:6px}
.msg.me{margin-left:20%;background:#f4e1b7}
.notice{padding:12px;border:1px solid #c8b18c;margin:8px 0;background:#fff9ed}
.market{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.marketList{min-width:0}
.sell3{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:12px}
.report2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sectionTitle{
  background:#72150f;color:#ffe6a6;border:2px solid #c59a47;
  padding:7px 12px;text-align:center;font-weight:bold;font-size:20px;margin-bottom:8px
}
.fatal{
  margin:80px auto;padding:25px;width:min(700px,90vw);background:#fff0dd;border:4px solid #8e1711
}


/* ================= BUILD C3 / ANA SAYFA ================= */
.homeC3{
  display:grid;
  grid-template-columns:820px 300px;
  width:1120px;
  min-height:806px;
  background:#d7c29b;
}
.homeSceneC3{
  position:relative;
  width:820px;
  height:806px;
  overflow:hidden;
  border-right:2px solid #a77c32;
  background:#cdb07a;
}
.homeSceneC3 .sceneImg{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
}
.homeSceneC3:after{

}
.homeTitleC3{
  position:absolute;z-index:3;left:50%;top:20px;transform:translateX(-50%);

.homeHotspot:hover,.homeHotspot:active{background:linear-gradient(#8b1c14,#5c0e0a)}
.hs-ludus{left:42%;top:14%}
.hs-guild{left:8%;top:24%}
.hs-arena{right:7%;top:23%}
.hs-gladiators{left:34%;top:37%}
.hs-training{left:8%;top:49%}
.hs-inventory{right:7%;top:48%}
.hs-upgrade{left:14%;top:66%}
.hs-market{right:11%;top:65%}
.hs-messages{left:32%;top:78%}
.hs-quests{right:29%;top:80%}
.homeStatusC3{
  width:300px;min-height:806px;padding:24px 18px;

}
.homeStatusC3 h2{

}
.todayC3 .ti{font-size:25px;text-align:center}
.todayC3 b{font-size:23px;color:#6d140f;text-align:right}
.homeMiniC3{margin-top:22px;padding:12px;border:1px solid #b88b45;background:#fff8e7aa}
.homeMiniC3 .statrow{font-size:14px}


/* ================= BUILD C3 / GLADYATÖRLER ================= */
.gladsC3{
  width:1120px;min-height:806px;position:relative;overflow:hidden;
  background:
    linear-gradient(90deg,#0000 0 73%,#f6e7c9f5 73% 100%),
    radial-gradient(circle at 45% 15%,#fff4c955,transparent 35%),
    linear-gradient(145deg,#b9894f,#e5c690 48%,#9f6e3e);
}
.gladsSceneC3{
  position:absolute;left:0;top:0;bottom:150px;width:820px;
  background:
    linear-gradient(#fff8d018,#0000 55%,#3b180a38),
    radial-gradient(ellipse at 50% 95%,#d5b47e 0 38%,transparent 39%),
    linear-gradient(115deg,#a86f3f 0 18%,#e2c28b 18% 82%,#9c6538 82%);
  border-right:2px solid #a77c32;
}
.gladsSceneC3:before{
  content:"";position:absolute;left:70px;right:70px;top:62px;height:310px;
  border:18px solid #d8bc87;border-bottom-width:26px;
  box-shadow:inset 0 0 0 4px #8f683b,0 8px 25px #0004;
  background:
    repeating-linear-gradient(90deg,#6e3d22 0 58px,#c69b61 59px 72px),
    linear-gradient(#8fb0bd,#ead29d 65%);

}
.gladsSceneC3:after{
  content:"LUDUS AVLU";position:absolute;left:50%;top:24px;transform:translateX(-50%);
  color:#ffe5a1;background:#65130fe8;border:2px solid #c69a43;padding:8px 30px;
  font-size:23px;font-weight:bold;letter-spacing:1px
}
.gladiatorStageC3{
  position:absolute;z-index:3;left:35px;right:35px;top:315px;
  display:flex;justify-content:space-around;align-items:flex-end
}
.gladiatorFigureC3{text-align:center;color:#3a1b0d;text-shadow:0 1px #ffe9b7}
.gladiatorFigureC3 .body{font-size:76px;filter:drop-shadow(0 5px 3px #0005)}
.gladiatorFigureC3 b{display:block;background:#f3dfb8dd;border:1px solid #8f683b;padding:3px 7px}
.gladsPanelC3{
  position:absolute;right:0;top:0;width:300px;bottom:0;padding:20px 17px;
  background:linear-gradient(#fffaf0f7,#efddbbf7);border-left:1px solid #c49a55
}
.gladsPanelC3 h1{margin:4px 0;color:#65130f;font-size:27px}
.gladsPanelC3 .portrait{
  width:90px;height:90px;margin:0 auto 10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:54px;
  background:linear-gradient(#7d1b13,#32110d);border:3px solid #c99d46
}
.gladsActionsC3{display:grid;gap:8px;margin-top:14px}
.gladsRosterC3{
  position:absolute;z-index:5;left:0;bottom:0;width:820px;height:150px;
  display:flex;gap:9px;align-items:center;padding:13px 14px;overflow-x:auto;
  background:linear-gradient(#4d0d0af4,#2f0907f7);border-top:3px solid #c79a42
}
.gladsRosterC3 .fighter{
  min-width:116px;height:120px;color:#ffe8b0;background:#68130f;border-color:#b98a40
}
.gladsRosterC3 .fighter.selected{background:#f2d58c;color:#3c1e0b}
.gladsRosterC3 .avatar{width:55px;height:55px;font-size:27px}

@media(max-width:900px){
  html,body{min-width:0!important;width:100%;overflow-x:hidden!important}
  #app{width:1280px;min-width:1280px;transform-origin:top left}
  .sidebar{display:block;width:160px}
  .top{left:160px;right:auto;width:1120px;height:58px;position:absolute}
  .main{margin-left:160px;padding-top:58px;padding-bottom:0;width:1120px;min-width:1120px}
  .bottomnav{display:none!important}
}

/* ================= BUILD C4 / HATA 001–035 REVİZYONU ================= */
html,body{overflow-x:hidden!important}
#app{width:1280px;transform-origin:top left}
body{min-width:0!important}
.main{overflow:hidden}

/* Home: use only the courtyard crop of IMG_1576; never render the screenshot UI twice. */
.homeC3{grid-template-columns:820px 300px;height:662px;min-height:662px}
.homeSceneC3{width:820px;height:662px;background-image:url("images/IMG_1576.png");background-size:1175px 661px;background-position:-122px -44px;background-repeat:no-repeat}
.homeSceneC3 .sceneImg{display:none!important}
.homeStatusC3{min-height:662px;height:662px;padding:18px 16px}
.homeTitleC3{display:none}
.homeHotspot{font-size:13px;padding:6px 9px;min-width:100px}
.homeMiniC3{margin-top:12px}
.todayC3{margin:6px 0;padding:8px 6px}
.todayC3 .ti{font-size:0}
.todayC3 .ti:after{content:"◆";font-size:13px;color:#8a641f}

/* Gladiators: full Ludus composition, compact right panel, roster at bottom. */
.gladsC3{height:662px;min-height:662px;background:#d8bc86}
.gladsSceneC3{bottom:118px;width:850px;background:
 linear-gradient(#9fc7d4 0 22%,transparent 22%),
 linear-gradient(90deg,#c99f68 0 9%,#e9d1a3 9% 91%,#c99f68 91%);
}
.gladsSceneC3:before{left:35px;right:35px;top:35px;height:245px;border-width:13px;border-bottom-width:22px;background:
 repeating-linear-gradient(90deg,#8b2a20 0 46px,#d9b477 46px 58px),
 linear-gradient(#a7cbd5,#e9d1a3 65%);opacity:.9}
.gladsSceneC3:after{top:12px;font-size:18px;padding:5px 24px}
.gladiatorStageC3{left:55px;right:55px;top:278px}
.gladiatorFigureC3 .body{font-size:0;width:70px;height:145px;position:relative;margin:auto}
.gladiatorFigureC3 .body:before{content:"";position:absolute;left:22px;top:0;width:30px;height:30px;border-radius:50%;background:#5e261b;border:4px solid #b98b43;box-shadow:0 28px 0 10px #7a1a13,0 74px 0 5px #6e4a2b}
.gladiatorFigureC3 .body:after{content:"";position:absolute;left:5px;top:54px;width:62px;height:8px;background:#4c2d20;transform:rotate(-8deg);box-shadow:8px 50px 0 -1px #4c2d20}
.gladiatorFigureC3 b{font-size:12px;padding:2px 6px}
.gladsPanelC3{width:270px;padding:10px 14px;overflow:hidden}
.gladsPanelC3 .portrait{width:62px;height:62px;font-size:0;position:relative}
.gladsPanelC3 .portrait:before{content:"";width:32px;height:38px;border-radius:45% 45% 35% 35%;background:#7b2a1d;border:4px solid #c99d46}
.gladsPanelC3 h1{font-size:21px;margin:2px 0}
.gladsPanelC3 p,.gladsPanelC3 .statrow{font-size:12px}
.gladsPanelC3 h3{font-size:14px;margin:6px 0}
.gladsPanelC3 .hr{margin:7px 0}
.gladsActionsC3{grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.gladsActionsC3 .btn{padding:7px 5px;font-size:11px}
.gladsRosterC3{width:850px;height:118px;padding:8px 12px;overflow:hidden}
.gladsRosterC3 .fighter{min-width:125px;height:96px;padding:6px}
.gladsRosterC3 .avatar{width:42px;height:42px;font-size:0;position:relative;background:#4d0d0a}
.gladsRosterC3 .avatar:after{content:"";display:block;width:22px;height:28px;margin:5px auto;border-radius:45% 45% 35% 35%;background:#8d3a25;border:3px solid #c69a43}

/* Training: physical Ludus training yard instead of empty form space. */
.trainingC4{padding:14px 18px;height:662px;background:linear-gradient(#ead7ac,#cda66f)}
.trainingTitleC4{text-align:center;margin:0 auto 8px;width:260px;background:#72150f;color:#ffe5a0;border:2px solid #c69a43;padding:6px;font-size:22px}
.trainingStationsC4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stationC4{height:170px;position:relative;overflow:hidden;border:2px solid #a47736;background:linear-gradient(#b9d0d2 0 38%,#d7b27b 38%);cursor:pointer}
.stationC4.selected{outline:4px solid #d5a63e}
.stationC4 .stationArt{height:105px;position:relative}
.stationC4 .stationArt:before{content:"";position:absolute;left:50%;top:16px;width:42px;height:78px;transform:translateX(-50%);border-radius:18px 18px 8px 8px;background:#6e1a14;box-shadow:-38px 22px 0 -16px #65412a,38px 22px 0 -16px #65412a}
.stationC4 .stationArt:after{content:"";position:absolute;left:50%;top:7px;width:28px;height:28px;transform:translateX(-50%);border-radius:50%;background:#5b2c20;border:3px solid #ba8a42}
.stationC4 h3{margin:3px 8px;color:#5f130f}
.stationC4 p{margin:2px 8px;font-size:12px}
.trainingBottomC4{display:grid;grid-template-columns:1fr 260px;gap:10px;margin-top:10px}
.trainingYardC4{height:315px;border:2px solid #a47736;background:linear-gradient(#ead5a8,#d2aa73);padding:10px}
.trainingRosterC4{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.trainingFighterC4{padding:7px;text-align:center;background:#f5e4bf;border:1px solid #a47736;cursor:pointer}
.trainingFighterC4.selected{background:#72150f;color:#ffe4a0;border:2px solid #d0a044}
.trainingPortraitC4{height:58px;position:relative}
.trainingPortraitC4:before{content:"";position:absolute;left:50%;top:5px;width:30px;height:45px;transform:translateX(-50%);border-radius:45% 45% 30% 30%;background:#7b241b;border:3px solid #b98a42}
.trainingInfoC4{background:#fff6e4;border:2px solid #a47736;padding:12px}
.trainingInfoC4 h2{margin:0 0 5px;color:#64130e}

function normalize(raw){
  const d=defaultState();
  if(!raw||typeof raw!=="object")return d;

  const s=Object.assign(d,raw);

  s.ludus=Object.assign(d.ludus,raw.ludus||{});
  s.stones=Object.assign(d.stones,raw.stones||{});
  s.stones.blue=Object.assign(d.stones.blue,(raw.stones||{}).blue||{});
  s.stones.ruby=Object.assign(d.stones.ruby,(raw.stones||{}).ruby||{});
  s.daily=Object.assign(d.daily,raw.daily||{});
  s.arena=Object.assign(d.arena,raw.arena||{});
  s.guild=Object.assign(d.guild,raw.guild||{});
  s.market=Object.assign(d.market,raw.market||{});
  s.messages=Object.assign(d.messages,raw.messages||{});
  s.transactions=raw.transactions||{};

  if(!Array.isArray(s.gladiators)||!s.gladiators.length)s.gladiators=d.gladiators;
  if(!Array.isArray(s.items)||!s.items.length)s.items=d.items;
  if(!Array.isArray(s.training))s.training=[];
  if(!Array.isArray(s.activeQuests))s.activeQuests=[];
  if(!Array.isArray(s.questHistory))s.questHistory=[];
  if(!Array.isArray(s.market.listings))s.market.listings=[];
  if(!Array.isArray(s.market.myListings))s.market.myListings=[];
  if(!Array.isArray(s.guild.warRoster))s.guild.warRoster=[];
  if(!Array.isArray(s.arena.selectedTeam))s.arena.selectedTeam=[];

  s.items=s.items.map(x=>{
    const n=Object.assign({
      id:uid("item"),
      name:"Item",
      type:"Silah",
      plus:0,
      model:"Standart",
      grade:1,
      stats:baseStats(.7),
      blue:[null,null,null,null],
      purple:[null,null],
      equippedBy:null,
      marketLocked:false,
      listingId:null,
      destroyed:false
    },x);
    if(x.ruby&&!x.purple)n.purple=x.ruby;
    n.blue=(n.blue||[]).concat([null,null,null,null]).slice(0,4);
    n.purple=(n.purple||[]).concat([null,null]).slice(0,2);
    return n;
  });

  return s;
}

function activityTick(){
  const t=Date.now();

  for(const a of [...S.training]){
    if(t>=a.end){
      const g=S.gladiators.find(x=>x.id===a.gladiatorId);
      const tr=TRAININGS.find(x=>x.id===a.type);
      if(g&&tr){
        g.status="Hazır";
        g.fatigue=clamp(g.fatigue+tr.fatigue,0,100);
        g.ovr=clamp(g.ovr+.2,1,100);
        g.statPower=+(g.statPower+tr.gain).toFixed(1);
        g.exp+=250;
        S.ludus.exp+=120;
        addSystem(`${g.name} ${tr.name} antrenmanını tamamladı.`);
      }
      S.training=S.training.filter(x=>x.id!==a.id);
    }
  }

  for(const a of [...S.activeQuests]){
    if(t>=a.end){
      completeQuest(a);
    }
  }

  if(S.daily.day!==dayKey()){
    S.daily={day:dayKey(),questsAssigned:0,completed:0};

    for(const g of S.gladiators){
      if(g.status==="Hazır"){
        const keys=["health","stamina","agility","attack","defense"];
        const k=keys[Math.floor(Math.random()*keys.length)];
        g.stats[k]=Math.max(1,Math.round(g.stats[k]*.99));
      }
    }
  }
}

function remaining(end){
  const ms=Math.max(0,end-Date.now());
  const min=Math.ceil(ms/60000);
  if(min>=60)return `${Math.floor(min/60)}s ${min%60}dk`;
  return `${min} dk`;
}

function startTraining(type){

    end:Date.now()+t.minutes*60000

}

function confirmQuest(gid){
  if(S.daily.questsAssigned>=3)return toast("Bugünkü 3 görev hakkı kullanıldı.");

  const q=QUESTS.find(x=>x.id===selectedQuest);
  const g=S.gladiators.find(x=>x.id===gid);
  if(!q||!g||g.status!=="Hazır")return;

  g.status="Görevde";
  S.daily.questsAssigned++;

  S.activeQuests.push({
    id:uid("quest"),
    questId:q.id,
    gladiatorId:g.id,
    start:Date.now(),
    end:Date.now()+q.hours*3600000
  });

  addSystem(`${g.name}, ${q.tier.toLowerCase()} için yola çıktı.`);
  closeModal();
  save();render();
}

function completeQuest(a){
  const q=QUESTS.find(x=>x.id===a.questId);
  const g=S.gladiators.find(x=>x.id===a.gladiatorId);
  if(!q||!g){
    S.activeQuests=S.activeQuests.filter(x=>x.id!==a.id);
    return;
  }

  const chance=clamp(55+(g.ovr-q.diff)*1.5,25,92);
  const success=Math.random()*100<chance;

  g.status="Hazır";
  g.exp+=Math.round(q.exp*.5);
  g.fatigue=clamp(g.fatigue+8,0,100);

  let rewards={gold:0,exp:Math.round(q.exp*.5),diamond:0,sapphire:0,ruby:0};

  if(success){
    rewards.gold=q.gold;
    rewards.exp=q.exp;
    rewards.diamond=1+Math.floor(Math.random()*3);
    rewards.sapphire=1+Math.floor(Math.random()*3);
    rewards.ruby=Math.random()<.55?1:0;

    S.gold+=rewards.gold;
    g.exp+=Math.round(q.exp*.5);
    S.stones.diamond+=rewards.diamond;
    S.stones.blue.extraHP+=rewards.sapphire;
    S.stones.ruby.teamSkillPower+=rewards.ruby;
    S.ludus.exp+=Math.round(q.exp*.3);
  }else{
    if(Math.random()<.25){
      g.injury=1;
      g.status="Sakat";
    }
  }

  S.daily.completed++;
  S.activeQuests=S.activeQuests.filter(x=>x.id!==a.id);
  S.questHistory.unshift({
    id:uid("qh"),
    quest:q.title,
    gladiator:g.name,
    success,
    rewards,
    time:Date.now()
  });

  addSystem(success?`Görev tamamlandı: ${q.title}`:`Görev başarısız: ${q.title}`);
}

function upgradeStats(stats){
  const n=clone(stats);
  for(const k of ["attackMin","attackMax","defenseA","defenseB","attackRate","block"]){
    n[k]=Math.round(n[k]*1.05);
  }
  n.critical+=1;
  n.critRes+=1;
  return n;
}

function fortunaValue(i){
  return i.blue.filter(Boolean)
    .filter(x=>x.stone==="fortuna")
    .reduce((a,b)=>a+(Number(b.value)||0),0);
}

function previewStats(a,b){
  const row=(name,k,suffix="")=>`
    <div class="statrow">
      <span>${name}</span>
      <b>${a[k]}${suffix} → <span class="good">${b[k]}${suffix}</span></b>
    </div>`;
  return`
    <div class="statrow"><span>Physical Attack</span><b>${a.attackMin}~${a.attackMax} → <span class="good">${b.attackMin}~${b.attackMax}</span></b></div>
    <div class="statrow"><span>Physical Defense</span><b>${a.defenseA}/${a.defenseB} → <span class="good">${b.defenseA}/${b.defenseB}</span></b></div>
    ${row("Critical","critical")}
    ${row("Critical Resistance","critRes","%")}
    ${row("Attack Rate","attackRate")}
    ${row("Block Rate","block")}
  `;
}

function enhance(){
  const i=selectedItem();
  if(!i||i.marketLocked)return toast("Bu item geliştirilemez.");
  if(S.stones.diamond<1)return toast("Elmas yetersiz.");

  S.stones.diamond--;

  const risky=i.plus>=5;
  let chance=100;

  if(risky){
    chance=70+Math.floor(fortunaValue(i)/100);

    if(S.stones.blue.felix>0){
      chance+=5;
      S.stones.blue.felix--;
    }
  }

  const success=Math.random()*100<chance;

  if(success){
    i.plus++;
    i.grade++;
    i.stats=upgradeStats(i.stats);
    addSystem(`${i.name} +${i.plus} seviyesine geliştirildi.`);
    toast(`Başarılı! ${i.name} +${i.plus}`);
  }else{
    const destruction=Math.random()<.20;

    if(destruction){
      if(S.stones.blue.tenax>0){
        S.stones.blue.tenax--;
        addSystem(`TENAX, ${i.name} itemini yok olmaktan korudu.`);
        toast("Başarısız. TENAX itemi korudu.");
      }else{
        i.destroyed=true;
        i.equippedBy=null;
        addSystem(`${i.name} geliştirme sırasında yok oldu.`);
        toast("Geliştirme başarısız: item yok oldu.");
      }
    }else{
      toast("Geliştirme başarısız. Item korundu.");
    }
  }

  save();render();
}

function putStone(kind,index,key){
  const i=selectedItem();
  const isBlue=kind==="blue";
  const inv=isBlue?S.stones.blue:S.stones.ruby;
  const defs=isBlue?BLUE_STONES:RUBY_STONES;
  const d=defs.find(x=>x[0]===key);

  if(!i||!d||!inv[key])return toast("Bu taştan kalmadı.");

  const arr=isBlue?i.blue:i.purple;
  const old=arr[index];

  if(old&&inv[old.stone]!=null)inv[old.stone]++;

  inv[key]--;

  let value=1;
  if(key==="fortuna")value=25+Math.floor(Math.random()*51);
  else if(isBlue)value=4+Math.floor(Math.random()*9);
  else value=2+Math.floor(Math.random()*5);

  arr[index]={
    stone:key,
    name:d[1],
    value,
    quality:60+Math.floor(Math.random()*40)
  };

  closeModal();
  save();render();
}

  tx(tid,()=>{
    S.gold-=l.price;

      const ni=item(
        uid("item"),
        l.name,
        l.type,
        l.plus,
        l.model,
        clone(l.stats),
        clone(l.blue),
        clone(l.purple),
        null

      S.items.push(ni);
      S.selectedItem=ni.id;

function rankedFight(){
  if(S.arena.selectedTeam.length!==5)return;

  const team=S.arena.selectedTeam.map(id=>S.gladiators.find(g=>g.id===id)).filter(Boolean);
  const power=team.reduce((a,g)=>a+g.ovr,0);
  const enemy=320+Math.floor(Math.random()*70);
  const chance=clamp(50+(power-enemy)*.7,20,80);
  const win=Math.random()*100<chance;
  const delta=win?24:-18;

  S.arena.rating=Math.max(0,S.arena.rating+delta);
  if(win)S.arena.wins++;else S.arena.losses++;

  for(const g of team)g.fatigue=clamp(g.fatigue+5,0,100);

  S.arena.lastResult={win,delta,power,enemy,time:Date.now()};
  addSystem(`Ranked Arena sonucu: ${win?"Zafer":"Mağlubiyet"} (${delta>0?"+":""}${delta} RP)`);
  save();render();
}

function imperialFight(){
  const place=1+Math.floor(Math.random()*20);
  S.arena.imperialLast=place;
  addSystem(`Imperial Arena tamamlandı: ${place}. sıra.`);
  toast(`Imperial Arena: ${place}. oldun.`);
  save();render();
}

function warPower(){
  return S.guild.warRoster.reduce((a,idx)=>a+GUILD_NAMES[idx][2]*130,0)+120000;
}

function toggleWarMember(idx){
  if(S.guild.warLocked)return;
  if(S.guild.warRoster.includes(idx)){
    S.guild.warRoster=S.guild.warRoster.filter(x=>x!==idx);
  }else{
    if(S.guild.warRoster.length>=20)return toast("Savaş kadrosu 20 kişidir.");
    if(idx===5)return toast("Bu üye sakat.");
    S.guild.warRoster.push(idx);
  }
  save();render();
}

function lockWar(){
  if(S.guild.warRoster.length!==20)return toast("20 kişilik kadro tamamlanmalı.");
  S.guild.warLocked=true;
  addSystem("Guild War kadrosu kilitlendi.");
  save();render();
}

function startWar(){
  if(!S.guild.warLocked)return;

  const own=warPower();
  const enemy=171800;
  const chance=clamp(50+(own-enemy)/3000,25,75);
  const win=Math.random()*100<chance;

  const ownReport=S.guild.warRoster.map((idx,n)=>{
    const m=GUILD_NAMES[idx];
    return{
      name:m[0],
      klass:m[1],
      damage:Math.round((m[2]*400)+(Math.random()*9000))
    }
  }).sort((a,b)=>b.damage-a.damage);

  const enemyNames=[
    ["DracoMax","Secutor"],["BrutusD","Retiarius"],["NeroD","Murmillo"],["ValeriusD","Thraex"],
    ["Octavius","Hoplomachus"],["Lentulus","Secutor"],["Maro","Dimachaerus"],["FabiusD","Murmillo"],
    ["ClaudiusD","Retiarius"],["Aemilius","Thraex"],["Scipio","Secutor"],["Tiberius","Hoplomachus"],
    ["Gnaeus","Murmillo"],["Cato","Thraex"],["Magnus","Retiarius"],["DrususD","Secutor"],
    ["PubliusD","Hoplomachus"],["VarroD","Murmillo"],["SeverusD","Thraex"],["RufusD","Retiarius"]
  ];

  const enemyReport=enemyNames.map((m,n)=>({
    name:m[0],
    klass:m[1],
    damage:Math.round(7000+Math.random()*28000)
  })).sort((a,b)=>b.damage-a.damage);

  S.guild.lastWar={
    win,
    own,
    enemy,
    points:win?32:-18,
    mvp:ownReport[0],
    time:Date.now()
  };

  S.guild.warReport={
    own:ownReport,
    enemy:enemyReport,
    ownTotal:ownReport.reduce((a,b)=>a+b.damage,0),
    enemyTotal:enemyReport.reduce((a,b)=>a+b.damage,0)
  };

  S.guild.points=Math.max(0,S.guild.points+(win?32:-18));

  if(win){
    S.gold+=5000;
    S.stones.blue.extraHP+=3;
    S.stones.ruby.teamSkillPower+=2;
    S.stones.diamond+=3;
  }

  S.guild.warLocked=false;
  addSystem(`Guild War sonucu: ${win?"Zafer":"Mağlubiyet"}.`);
  page="warresult";
  save();render();
}

            ["Ferrum Ludus","VarroTR",1460],
            ["Capua Wolves","Titus34",1390],
            ["Sol Invictus","Lucius",1315]
          ].sort((a,b)=>b[2]-a[2]).map((x,n)=>`
            <tr style="${x[0]==="Aurea Ludus"?"background:#fff0b5":""}">
              <td>${n+1}</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function restGladiator(id){
  const g=S.gladiators.find(x=>x.id===id);
  if(!g)return;
  if(["Görevde","Antrenmanda"].includes(g.status))return toast("Gladyatör şu anda meşgul.");

  if(g.injury>0){
    g.injury=0;
    g.status="Hazır";
    g.condition=Math.max(g.condition,70);
    toast("Tedavi tamamlandı.");
  }else{
    g.fatigue=Math.max(0,g.fatigue-25);
    g.condition=Math.min(100,g.condition+15);
    toast("Gladyatör dinlendi.");
  }
  save();render();
}

function guildInvite(){
  if(S.guild.members>=30)return toast("Guild kapasitesi dolu: 30/30.");
  S.guild.members++;
  toast(`Yeni üye katıldı. ${S.guild.members}/30`);
  save();render();
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-page]");
  if(nav)go(nav.dataset.page);

  const q=e.target.closest("[data-confirm-quest]");
  if(q)confirmQuest(q.dataset.confirmQuest);

  const ps=e.target.closest("[data-put-stone]");
  if(ps){
    const [kind,index,key]=ps.dataset.putStone.split("|");
    putStone(kind,Number(index),key);
  }

  const sell=e.target.closest("[data-sell-item]");
  if(sell)sellSetup(sell.dataset.sellItem);

  const helper=e.target.closest("[data-price-helper]");
  if(helper){
    const inp=$("sellPrice");
    if(inp){
      inp.value=helper.dataset.priceHelper;
      inp.dispatchEvent(new Event("input"));
    }
  }

  const create=e.target.closest("[data-create-listing]");
  if(create)createListing(create.dataset.createListing);

  const ph=e.target.closest("[data-price-history]");
  if(ph){
    modal(`
      <h2>Fiyat Geçmişi</h2>
      ${S.market.history.map(h=>`
        <div class="statrow"><span>${h.name}</span><b>🪙 ${fmt(h.price)}</b></div>
      `).join("")}
      <br><button class="btn dark" data-close onclick="document.getElementById('modal').remove()">Kapat</button>
    `);
  }
});
