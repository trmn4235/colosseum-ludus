<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colosseum & Ludus — Build A3</title>

<style>
:root{
 --red:#681b24;--red2:#3d0d13;--gold:#c99b3e;
 --cream:#f4ead5;--paper:#fffaf1;--ink:#2d1d15;
 --line:#d8c39a;--green:#287542;--blue:#2869a8;--purple:#79358d
}
*{box-sizing:border-box}
body{
 margin:0;background:#160e0c;color:var(--ink);
 font-family:Georgia,"Times New Roman",serif;padding-bottom:78px
}
button{font-family:inherit}
#app{max-width:760px;margin:auto;min-height:100vh;background:#f3ead8}
header{
 position:sticky;top:0;z-index:30;color:#fff;padding:10px;
 background:linear-gradient(135deg,var(--red2),var(--red));
 border-bottom:3px solid var(--gold)
}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:17px;margin:0;letter-spacing:1px}
.brand small{color:#ead7a4}
.resources{
 display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:8px
}
.res{
 border:1px solid #b88c3d;background:#ffffff10;border-radius:5px;
 text-align:center;padding:4px 1px;font-size:9px
}
main{padding:12px}
.hero{
 background:linear-gradient(145deg,#7a2931,#3c1015);
 color:white;border:2px solid var(--gold);border-radius:12px;
 padding:17px;margin-bottom:10px;box-shadow:0 5px 15px #0003
}
.hero h2{margin:0 0 4px;font-size:23px}
.hero p{margin:4px 0;color:#ecd9aa}
.card{
 background:var(--paper);border:1px solid var(--line);
 border-radius:10px;padding:12px;margin:9px 0;box-shadow:0 2px 7px #44221115
}
.card h3{margin:0 0 8px;color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{
 display:flex;justify-content:space-between;padding:7px 0;
 border-bottom:1px dashed #d8c8aa
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{
 width:100%;border:0;border-radius:7px;padding:11px 7px;margin-top:6px;
 color:white;background:linear-gradient(#8b3039,#5a151c);
 border-bottom:2px solid #351015
}
.btn.gold{background:linear-gradient(#d8b25e,#ad7d25);color:#28190b}
.btn.light{background:#eee2ca;color:#3d281b;border:1px solid #cbb485}
.btn.blue{background:#28669b}
.btn.purple{background:#713584}
.btn:disabled{opacity:.45}
.muted{font-size:11px;color:#79695d}
.big{font-size:25px;font-weight:bold;color:var(--red)}
.good{color:var(--green);font-weight:bold}
.bad{color:#a52828;font-weight:bold}
.avatar{
 width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
 font-size:38px;background:linear-gradient(#e5d6b0,#9b7335);
 border:3px solid #79521c;flex:none
}
.gladiator{display:flex;gap:12px;align-items:center}
.bar{height:9px;background:#dfd2ba;border-radius:20px;overflow:hidden;margin:3px 0 7px}
.bar span{height:100%;display:block;background:linear-gradient(90deg,#8e2832,#d0a247)}
.tag{
 display:inline-block;font-size:10px;border:1px solid #cdb98c;
 background:#eee2c9;padding:3px 6px;border-radius:20px;margin:2px
}
.blueTag{border-color:#6b9bc5;background:#e7f1fa;color:#205d91}
.purpleTag{border-color:#a67bb2;background:#f1e7f5;color:#6d2f7b}
.slot{
 background:#f6eddc;border:1px solid #dac59c;border-radius:8px;
 padding:9px;margin:6px 0
}
.socketGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.socket{
 min-height:43px;border:1px dashed #bda982;border-radius:6px;
 padding:6px;font-size:10px;background:#fffaf1
}
.socket.blue{border-color:#6191bb}
.socket.purple{border-color:#9968a5}
.room{
 background:#f5ead4;border:1px solid #d0ba8c;border-radius:8px;
 padding:10px 4px;text-align:center
}
.room .ico{font-size:25px}
.room b{display:block;color:var(--red);font-size:12px}
.classBox{
 padding:9px;border:1px solid #d5bf94;background:#f5ead5;border-radius:8px
}
.quest{
 border-left:4px solid var(--gold)
}
.locked{opacity:.55}
hr{border:0;border-top:1px solid #d8c5a1}
.bottom{
 position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;
 display:grid;grid-template-columns:repeat(6,1fr);
 background:#3b0e13;border-top:2px solid var(--gold);z-index:40
}
.bottom button{
 background:none;border:0;color:#e5d3aa;padding:9px 1px;font-size:8px
}
.bottom span{display:block;font-size:18px}
.bottom .active{background:#702029;color:white}
.notice{
 display:none;position:fixed;bottom:77px;left:50%;transform:translateX(-50%);
 width:min(92%,700px);background:#251513;color:white;border:1px solid var(--gold);
 border-radius:8px;padding:11px;z-index:100
}
.modal{
 position:fixed;inset:0;background:#000a;z-index:90;
 display:flex;align-items:flex-end;justify-content:center
}
.sheet{
 width:min(760px,100%);max-height:82vh;overflow:auto;background:#f4ead7;
 border-radius:16px 16px 0 0;padding:15px;border-top:3px solid var(--gold)
}
</style>
</head>

<body>
<div id="app">

<header>
 <div class="brand">
  <div>
   <h1>COLOSSEUM & LUDUS</h1>
   <small>Aurea Ludus · Roma</small>
  </div>
  <div style="text-align:right">
   <b id="lv">LV.12</b><br>
   <small id="rating">1500 RP</small>
  </div>
 </div>

 <div class="resources">
  <div class="res">🪙<br><b id="gold"></b></div>
  <div class="res">💎<br><b id="diamond"></b></div>
  <div class="res">🔵<br><b id="sapphire"></b></div>
  <div class="res">🟣<br><b id="ruby"></b></div>
  <div class="res">⭐<br><b id="exp"></b></div>
  <div class="res">⚔️<br><b id="count"></b></div>
 </div>
</header>

<main id="screen"></main>

<nav class="bottom">
 <button onclick="go('ludus')"><span>🏛️</span>LUDUS</button>
 <button onclick="go('roster')"><span>⚔️</span>KADRO</button>
 <button onclick="go('equipment')"><span>🛡️</span>EKİPMAN</button>
 <button onclick="go('quest')"><span>📜</span>GÖREV</button>
 <button onclick="go('training')"><span>🏋️</span>EĞİTİM</button>
 <button onclick="go('menu')"><span>☰</span>MENÜ</button>
</nav>

<div id="notice" class="notice"></div>
<div id="modal"></div>
</div>

<script>
const KEY="LUDUS_A3";

const BLUE_POOL=[
 "Extra HP +3%",
 "HP Regen +2%",
 "Kondisyon +3%",
 "Kondisyon Regen +2%",
 "Critical +3%",
 "Block Rate +4%"
];

const RUBY_POOL=[
 "Team Skill Power +2%",
 "Team Skill Trigger +2%",
 "Team Passive Resistance +2%",
 "Vanguard +2%",
 "Mars +2%",
 "Aegis +2%",
 "Concordia +2%",
 "Victoria +2%"
];

const CLASSES={
 Murmillo:{
  anti:"Retiarius",
  weak:"Hoplomachus",
  skill:"Scutum Bash",
  passive:"Fortis",
  desc:"Kalkan ve yakın mesafe dayanıklılığı."
 },
 Secutor:{
  anti:"Retiarius",
  weak:"Murmillo",
  skill:"Hunter's Rush",
  passive:"Pursuit",
  desc:"Hızlı baskı ve takip."
 },
 Hoplomachus:{
  anti:"Murmillo",
  weak:"Secutor",
  skill:"Spear Wall",
  passive:"Discipline",
  desc:"Menzil kontrolü ve savunma."
 },
 Retiarius:{
  anti:"Hoplomachus",
  weak:"Secutor",
  skill:"Net Trap",
  passive:"Evasion",
  desc:"Hız ve alan kontrolü."
 }
};

const EQUIPMENT_TEMPLATE=[
 ["Silah","Gladius"],
 ["Kalkan","Scutum"],
 ["Başlık","Galea"],
 ["Zırh","Lorica"],
 ["Kolluk","Manica"],
 ["Bacaklık","Greaves"]
];

function makeEquipment(){
 return EQUIPMENT_TEMPLATE.map((x,i)=>({
  slot:x[0],
  name:x[1],
  plus:i===0?5:i===1?3:i===2?4:i===3?6:2,
  blue:[null,null,null,null],
  ruby:[null,null],
  destroyed:false
 }));
}

const DEFAULT={
 gold:1250000,
 diamond:10,
 sapphire:18,
 ruby:12,
 exp:18400,
 rating:1500,
 level:12,
 selected:0,

 special:{felix:3,vesper:2,tenax:2},

 rooms:{
  training:2,
  forge:2,
  infirmary:1,
  kitchen:1,
  beds:2,
  chest:2
 },

 staff:{
  doctore:{level:4,max:20,effect:"Antrenman verimi"},
  faber:{level:4,max:20,effect:"Ekipman geliştirme"},
  medicus:{level:3,max:10,effect:"Sakatlık iyileşmesi"},
  coquus:{level:3,max:10,effect:"Kondisyon yenilenmesi"},
  custos:{level:2,max:10,effect:"Ludus güvenliği"}
 },

 gladiators:[
  {
   name:"Aulus Varro",class:"Murmillo",level:12,ovr:72,
   hp:1840,stamina:610,agility:128,attack:2690,defense:248,
   crit:17,critRes:12,attackSpeed:409,block:100,
   condition:84,fatigue:16,injury:0,activity:"Hazır",
   skillLevel:7,passiveLevel:6,equipment:makeEquipment()
  },
  {
   name:"Cassius Nero",class:"Secutor",level:8,ovr:64,
   hp:1580,stamina:570,agility:135,attack:2180,defense:214,
   crit:14,critRes:10,attackSpeed:430,block:82,
   condition:92,fatigue:8,injury:0,activity:"Hazır",
   skillLevel:5,passiveLevel:4,equipment:makeEquipment()
  },
  {
   name:"Titus Flavius",class:"Hoplomachus",level:7,ovr:61,
   hp:1490,stamina:550,agility:142,attack:2050,defense:198,
   crit:15,critRes:9,attackSpeed:421,block:70,
   condition:88,fatigue:12,injury:0,activity:"Hazır",
   skillLevel:4,passiveLevel:4,equipment:makeEquipment()
  }
 ]
};

let old={};
try{old=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}

let S=deepMerge(DEFAULT,old);
let page="ludus";
let equipIndex=0;

function deepMerge(base,saved){
 const out=structuredClone(base);
 Object.keys(saved||{}).forEach(k=>{
  if(
   saved[k] &&
   typeof saved[k]==="object" &&
   !Array.isArray(saved[k]) &&
   out[k] &&
   typeof out[k]==="object" &&
   !Array.isArray(out[k])
  ){
   out[k]=deepMerge(out[k],saved[k]);
  }else out[k]=saved[k];
 });
 return out;
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 topbar();
}

function fmt(n){
 return Number(n||0).toLocaleString("tr-TR");
}

function G(){
 return S.gladiators[S.selected];
}

function topbar(){
 gold.textContent=fmt(S.gold);
 diamond.textContent=S.diamond;
 sapphire.textContent=S.sapphire;
 ruby.textContent=S.ruby;
 exp.textContent=fmt(S.exp);
 count.textContent=S.gladiators.length;
 lv.textContent="LV."+S.level;
 rating.textContent=S.rating+" RP";
}

function msg(t){
 notice.textContent=t;
 notice.style.display="block";
 clearTimeout(window.nt);
 window.nt=setTimeout(()=>notice.style.display="none",2600);
}

function go(p){
 page=p;
 render();
 scrollTo(0,0);
}

function render(){
 topbar();
 modal.innerHTML="";

 document.querySelectorAll(".bottom button")
 .forEach(x=>x.classList.remove("active"));

 const nav={
  ludus:0,roster:1,equipment:2,quest:3,training:4,menu:5
 };

 if(nav[page]!==undefined)
  document.querySelectorAll(".bottom button")[nav[page]].classList.add("active");

 if(page==="ludus") screen.innerHTML=ludus();
 if(page==="roster") screen.innerHTML=roster();
 if(page==="gladiator") screen.innerHTML=gladiator();
 if(page==="equipment") screen.innerHTML=equipment();
 if(page==="item") screen.innerHTML=itemDetail();
 if(page==="stones") screen.innerHTML=stones();
 if(page==="quest") screen.innerHTML=quests();
 if(page==="training") screen.innerHTML=training();
 if(page==="staff") screen.innerHTML=staff();
 if(page==="rooms") screen.innerHTML=rooms();
 if(page==="rest") screen.innerHTML=rest();
 if(page==="menu") screen.innerHTML=menu();
}

function ludusPower(){
 return S.gladiators.reduce((a,g)=>a+g.ovr,0)+
 Object.values(S.staff).reduce((a,x)=>a+x.level*2,0)+
 Object.values(S.rooms).reduce((a,x)=>a+x*3,0);
}

function ludus(){
 return `
 <section class="hero">
  <h2>Aurea Ludus</h2>
  <p>Roma · Ludus Seviyesi ${S.level}</p>
  <p>Toplam Ludus Gücü: <b>${ludusPower()}</b></p>
 </section>

 <div class="card">
  <h3>Bugünün Durumu</h3>
  ${S.gladiators.map(g=>`
   <div class="stat">
    <span>${g.name}<br><small class="muted">${g.activity}</small></span>
    <b>${g.condition}/100</b>
   </div>
  `).join("")}
 </div>

 <div class="card">
  <h3>Ludus Bölümleri</h3>
  <div class="grid3">
   ${roomBox("⚔️","Eğitim","training")}
   ${roomBox("🔨","Atölye","forge")}
   ${roomBox("⚕️","Revir","infirmary")}
   ${roomBox("🍖","Mutfak","kitchen")}
   ${roomBox("🛏️","Yataklar","beds")}
   ${roomBox("📦","Sandık","chest")}
  </div>
  <button class="btn light" onclick="go('rooms')">Bölümleri Yönet</button>
 </div>

 <div class="grid2">
  <button class="btn" onclick="go('staff')">👥 Çalışanlar</button>
  <button class="btn gold" onclick="go('roster')">⚔️ Gladyatörler</button>
 </div>
 `;
}

function roomBox(icon,n,k){
 return `
 <div class="room">
  <div class="ico">${icon}</div>
  <b>${n}</b>
  <small>Lv.${S.rooms[k]}</small>
 </div>`;
}

function roster(){
 return `
 <section class="hero">
  <h2>Gladyatörler</h2>
  <p>${S.gladiators.length} savaşçı Aurea Ludus adına dövüşüyor.</p>
 </section>

 ${S.gladiators.map((g,i)=>`
 <div class="card" onclick="selectG(${i})">
  <div class="gladiator">
   <div class="avatar">${classIcon(g.class)}</div>
   <div style="flex:1">
    <div class="row">
     <h3 style="margin:0">${g.name}</h3>
     <span class="big">${g.ovr}</span>
    </div>
    <b>${g.class}</b> · Lv.${g.level}
    <div class="muted">
     ${g.activity} · Kondisyon ${g.condition}/100
    </div>
   </div>
  </div>
 </div>
 `).join("")}
 `;
}

function classIcon(c){
 return {
  Murmillo:"🛡️",
  Secutor:"⚔️",
  Hoplomachus:"🔱",
  Retiarius:"🕸️"
 }[c]||"⚔️";
}

function selectG(i){
 S.selected=i;
 save();
 go("gladiator");
}

function gladiator(){
 const g=G();
 const c=CLASSES[g.class];

 return `
 <section class="hero">
  <div class="gladiator">
   <div class="avatar">${classIcon(g.class)}</div>
   <div>
    <h2>${g.name}</h2>
    <p>${g.class} · Lv.${g.level}</p>
    <div style="font-size:30px"><b>OVR ${g.ovr}</b></div>
   </div>
  </div>
 </section>

 <div class="card">
  <h3>Durum</h3>

  <div class="stat"><span>Kondisyon</span><b>${g.condition}/100</b></div>
  <div class="bar"><span style="width:${g.condition}%"></span></div>

  <div class="stat"><span>Yorgunluk</span><b>${g.fatigue}%</b></div>
  <div class="stat">
   <span>Sakatlık</span>
   <b class="${g.injury?'bad':'good'}">
    ${g.injury?"Seviye "+g.injury:"Yok"}
   </b>
  </div>
  <div class="stat"><span>Durum</span><b>${g.activity}</b></div>
 </div>

 <div class="card">
  <h3>Sınıf Sistemi</h3>
  <div class="classBox">
   <b>${g.class}</b>
   <p class="muted">${c.desc}</p>
   <div class="stat"><span>Avantajlı</span><b class="good">${c.anti}</b></div>
   <div class="stat"><span>Dezavantajlı</span><b class="bad">${c.weak}</b></div>
  </div>

  <div class="stat">
   <span>Skill — ${c.skill}</span>
   <b>Lv.${g.skillLevel}</b>
  </div>
  <div class="stat">
   <span>Passive — ${c.passive}</span>
   <b>Lv.${g.passiveLevel}</b>
  </div>
 </div>

 <div class="card">
  <h3>Savaş İstatistikleri</h3>
  ${stat("Health",fmt(g.hp))}
  ${stat("Stamina",fmt(g.stamina))}
  ${stat("Agility",g.agility)}
  ${stat("Physical Attack",fmt(g.attack))}
  ${stat("Physical Defense",g.defense)}
  ${stat("Critical",g.crit+"%")}
  ${stat("Critical Resistance",g.critRes+"%")}
  ${stat("Attack Speed",g.attackSpeed)}
  ${stat("Block Rate",g.block+"%")}
 </div>

 <div class="grid2">
  <button class="btn" onclick="go('equipment')">🛡️ Ekipman</button>
  <button class="btn gold" onclick="go('training')">🏋️ Antrenman</button>
  <button class="btn light" onclick="go('rest')">🛏️ Dinlen</button>
  <button class="btn light" onclick="go('quest')">📜 Göreve Gönder</button>
 </div>
 `;
}

function stat(a,b){
 return `<div class="stat"><span>${a}</span><b>${b}</b></div>`;
}

function equipment(){
 const g=G();

 return `
 <section class="hero">
  <h2>Ekipman</h2>
  <p>${g.name} · ${g.class}</p>
 </section>

 <div class="card">
  <p class="muted">
   Her ekipman 4 Safir + 2 Yakut taşıyabilir.
   Elmas yalnızca + geliştirmede kullanılır.
  </p>
 </div>

 ${g.equipment.map((e,i)=>`
 <div class="slot ${e.destroyed?'locked':''}" onclick="openItem(${i})">
  <div class="row">
   <div>
    <small class="muted">${e.slot}</small><br>
    <b>${e.destroyed?"Eşya Yok":e.name}</b>
   </div>
   <span class="big">${e.destroyed?"—":"+"+e.plus}</span>
  </div>

  ${!e.destroyed?`
  <div>
   ${e.blue.filter(Boolean).map(x=>`<span class="tag blueTag">🔵 ${x}</span>`).join("")}
   ${e.ruby.filter(Boolean).map(x=>`<span class="tag purpleTag">🟣 ${x}</span>`).join("")}
  </div>`:""}
 </div>
 `).join("")}

 <button class="btn light" onclick="go('stones')">Taş Envanteri</button>
 `;
}

function openItem(i){
 equipIndex=i;
 go("item");
}

function itemDetail(){
 const g=G();
 const e=g.equipment[equipIndex];

 if(e.destroyed){
  return `
  <div class="hero"><h2>${e.slot}</h2><p>Ekipman yuvası boş.</p></div>
  <div class="card center">
   <div style="font-size:55px">❌</div>
   <h3>Eşya Yok</h3>
   <p>Bu eşya başarısız geliştirmede yok edildi.</p>
   <button class="btn" onclick="replaceItem()">Standart Eşya Al — 25.000 🪙</button>
  </div>`;
 }

 return `
 <section class="hero">
  <small>${e.slot}</small>
  <h2>${e.name}</h2>
  <p>Geliştirme Seviyesi <b>+${e.plus}</b></p>
 </section>

 <div class="card">
  <h3>Safir Yuvaları — ${e.blue.filter(Boolean).length}/4</h3>
  <div class="socketGrid">
   ${e.blue.map((x,i)=>`
    <div class="socket blue" onclick="blueSocket(${i})">
     🔵 ${x||"Boş Safir Yuvası"}
    </div>
   `).join("")}
  </div>
 </div>

 <div class="card">
  <h3>Yakut Yuvaları — ${e.ruby.filter(Boolean).length}/2</h3>
  <div class="socketGrid">
   ${e.ruby.map((x,i)=>`
    <div class="socket purple" onclick="rubySocket(${i})">
     🟣 ${x||"Boş Yakut Yuvası"}
    </div>
   `).join("")}
  </div>
 </div>

 <div class="card">
  <h3>Geliştirme</h3>
  ${stat("Mevcut","+ "+e.plus)}
  ${stat("Sonraki","+ "+(e.plus+1))}
  ${stat("Maliyet","1 Elmas")}

  ${e.plus>=5?`
   <p class="bad">+5 sonrası geliştirme risklidir.</p>
   <div class="stat"><span>FELIX</span><b>×${S.special.felix}</b></div>
   <div class="stat"><span>VESPER</span><b>×${S.special.vesper}</b></div>
   <div class="stat"><span>TENAX</span><b>×${S.special.tenax}</b></div>
  `:`<p class="good">+1–+5 güvenli geliştirme.</p>`}

  <button class="btn gold" onclick="enhance()">💎 + Bas</button>
 </div>

 <button class="btn light" onclick="go('equipment')">Ekipmana Dön</button>
 `;
}

function blueSocket(i){
 const e=G().equipment[equipIndex];

 if(e.blue[i]){
  S.sapphire++;
  e.blue[i]=null;
  save();render();
  msg("Safir çıkarıldı ve envantere döndü.");
  return;
 }

 if(S.sapphire<1){
  msg("Envanterde Safir yok.");
  return;
 }

 modal.innerHTML=`
 <div class="modal" onclick="closeModal(event)">
  <div class="sheet">
   <h3>Safir Seç</h3>

function enhance(){
 const e=G().equipment[equipIndex];

 if(S.diamond<1){
  msg("Geliştirme için Elmas yok.");
  return;
 }

 S.diamond--;

 if(e.plus<5){
  e.plus++;
  recalc();
  save();render();
  msg(e.name+" +"+e.plus+" oldu.");
  return;
 }

 const felix=S.special.felix>0;
 if(felix)S.special.felix--;

 const success=70+(felix?5:0);
 const roll=Math.random()*100;

 if(roll<success){
  e.plus++;
  recalc();
  save();render();
  msg("Geliştirme başarılı: +"+e.plus);
  return;
 }

 /*
 VESPER:
 başarısızlıkta gerektiğinde itemi +4'te tutar.
 TENAX:
 yok olma sonucunu gerektiğinde engeller.
 */

 const destruction=Math.random()*100<20;

 if(destruction){
  if(S.special.tenax>0){
   S.special.tenax--;
   e.plus=Math.max(4,e.plus-1);
   save();render();
   msg("TENAX tüketildi. Eşyanın yok olması engellendi.");
   return;
  }

  e.destroyed=true;
  e.blue=[null,null,null,null];
  e.ruby=[null,null];
  save();render();
  msg("Geliştirme başarısız. Eşya yok oldu.");
  return;
 }

 if(S.special.vesper>0 && e.plus>4){
  S.special.vesper--;
  e.plus=4;
  save();render();
  msg("VESPER tüketildi. Eşya +4 seviyesinde korundu.");
  return;
 }

 save();render();
 msg("Geliştirme başarısız. Eşya korundu.");
}

function replaceItem(){
 const e=G().equipment[equipIndex];

 if(S.gold<25000){
  msg("Yeterli altın yok.");
  return;
 }

 S.gold-=25000;
 e.destroyed=false;
 e.plus=0;
 e.blue=[null,null,null,null];
 e.ruby=[null,null];
 save();render();
 msg("Yeni standart ekipman alındı.");
}

function recalc(){
 const g=G();
 const bonus=g.equipment.reduce((a,e)=>a+(e.destroyed?0:e.plus),0);
 g.ovr=Math.min(100,Math.round(
  (g.level*2.2)+(bonus*.55)+(g.attack/180)+(g.defense/40)
 ));
}

function mission(i){
 const m=MISSIONS[i],g=G();

 if(g.injury){
  msg("Sakat gladyatör göreve gönderilemez.");
  return;
 }

 if(g.condition<m.c){
  msg("Görev için kondisyon yetersiz.");
  return;
 }

 g.activity="Görevde";
 g.condition-=m.c;
 g.fatigue=Math.min(100,g.fatigue+m.c);

 const equipmentPower=g.equipment.reduce((a,e)=>a+(e.destroyed?0:e.plus),0);
 const power=g.ovr+(equipmentPower*.35)+(g.condition*.08);
 const chance=Math.max(15,Math.min(95,70+(power-m.difficulty)*.8));
 const win=Math.random()*100<chance;

 if(win){
  S.gold+=m.gold;
  S.exp+=m.exp;
  S.sapphire+=m.s;
  S.ruby+=m.r;
  S.diamond+=m.d;
 }else{
  g.condition=Math.max(0,g.condition-8);
  g.fatigue=Math.min(100,g.fatigue+10);

  const injuryRisk=Math.max(5,g.fatigue-55);

  if(Math.random()*100<injuryRisk)
   g.injury=Math.min(5,1+Math.floor(Math.random()*3));
 }

 g.activity="Hazır";
 save();

 screen.innerHTML=`
 <section class="hero" style="text-align:center">
  <div style="font-size:55px">${win?"🏆":"⚔️"}</div>
  <h2>${win?"Görev Tamamlandı":"Görev Başarısız"}</h2>

   ${stat("Yakut","+"+m.r)}
   ${stat("Elmas","+"+m.d)}
  `:`

  `}

  ${stat("Yorgunluk",g.fatigue+"%")}
 </div>

 `;

}

function train(type){
 const g=G();

 if(g.injury){
  msg("Sakat gladyatör antrenman yapamaz.");
  return;
 }

 if(g.condition<8){
  msg("Antrenman için kondisyon yetersiz.");
  return;
 }

 g.condition-=8;
 g.fatigue=Math.min(100,g.fatigue+8);

 const efficiency=1+(S.staff.doctore.level*.02)+(S.rooms.training*.02);

 if(type==="attack")g.attack+=Math.round(10*efficiency);
 if(type==="defense")g.defense+=Math.max(2,Math.round(2*efficiency));
 if(type==="agility")g.agility+=Math.max(2,Math.round(2*efficiency));

 if(type==="skill"){
  if(g.skillLevel>=10){
   msg("Skill mevcut eğitim sınırında.");
   return;
  }
  g.skillLevel++;
 }

 if(type==="passive"){
  if(g.passiveLevel>=10){
   msg("Passive mevcut eğitim sınırında.");
   return;
  }
  g.passiveLevel++;
 }

 S.exp+=Math.round(120*efficiency);
 recalc();
 save();render();
 msg("Antrenman tamamlandı.");
}
