function normalize(x){

var b=fresh();

if(!x || typeof x!=="object"){
return b;
}

Object.assign(b,x);

b.ludus=Object.assign(
fresh().ludus,
x.ludus||{}
);

b.ludus.staff=Object.assign(
fresh().ludus.staff,
(x.ludus&&x.ludus.staff)||{}
);

b.stones=Object.assign(
fresh().stones,
x.stones||{}
);

b.stones.blue=Object.assign(
fresh().stones.blue,
(x.stones&&x.stones.blue)||{}
);

b.stones.purple=Object.assign(
fresh().stones.purple,
(x.stones&&x.stones.purple)||{}
);

if(!Array.isArray(b.gladiators) || !b.gladiators.length){
b.gladiators=fresh().gladiators;
}

if(!Array.isArray(b.items) || !b.items.length){
b.items=fresh().items;
}

if(!b.market){
b.market=fresh().market;
}

if(!Array.isArray(b.market.listings)){
b.market.listings=marketSeed();
}

if(!Array.isArray(b.market.mine)){
b.market.mine=[];
}

if(!b.tx){
b.tx={};
}

return b;
}

window.doEnhance=function(){

var x=I(UI.enhance);

if(!x)return;

if(x.marketLocked){
toast("Satıştaki item geliştirilemez.");
return;
}

if(S.stones.diamond<1){

toast("Elmas yetersiz.");

return;
}

var risk=x.plus>=5;

var felix=S.stones.blue.felix>0;

var rate=
risk
?
70+(felix?5:0)
:
100;

S.stones.diamond--;

if(felix){

S.stones.blue.felix--;

}

if(chance(rate)){

Object.keys(x.stats).forEach(function(k){

x.stats[k]=Math.round(
x.stats[k]*1.05
);

});

x.plus++;

toast(
"Geliştirme başarılı. "+
x.name+
" +"+
x.plus
);

save();

render();

return;
}

if(risk && chance(20)){

if(S.stones.blue.tenax>0){

S.stones.blue.tenax--;

toast(
"Geliştirme başarısız. TENAX itemi korudu."
);

save();

render();

return;
}

x.destroyed=true;

x.equippedBy=null;

toast(
"Geliştirme başarısız. Item yok oldu."
);

save();

render();

return;
}

toast(
"Geliştirme başarısız. Item korundu."
);

save();

render();
};

window.assignQuest=function(){

var q=QUESTS.find(function(x){
return x.id===UI.quest;
});

var g=sg();

if(!q)return;

if(g.status!=="ready"){

toast("Gladyatör hazır değil.");

return;
}

g.status="quest";

var success=chance(
clamp(
70+(g.overall-q.diff)*0.8,
25,
95
)
);

var conditionCost=
q.risk==="Yüksek"
?
17
:
q.risk==="Orta"
?
11
:
6;

var fatigueCost=
q.risk==="Yüksek"
?
18
:
q.risk==="Orta"
?
12
:
6;

g.condition=clamp(
g.condition-conditionCost,
0,
100
);

g.fatigue=clamp(
g.fatigue+fatigueCost,
0,
100
);

if(success){

S.gold+=q.gold;

g.exp+=q.exp;

S.ludus.exp+=q.exp;

S.stones.blue.extra_hp++;

S.completedToday++;

msg(
"Görev Tamamlandı",
g.name+" · "+q.name
);

}else{

if(chance(20)){

g.injury=1;

g.status="injured";

}

}

g.status=
g.injury
?
"injured"
:
"ready";

S.questHistory.unshift({
name:q.name,
success:success
});

save();

toast(
success
?
"Görev başarılı."
:
"Görev başarısız."
);

render();
};
