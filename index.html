<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Colosseum & Ludus</title>

<style>
:root{
  --wine:#641b22;
  --wine2:#431014;
  --gold:#c89b3c;
  --cream:#f4ead3;
  --paper:#fffaf0;
  --ink:#2a1a13;
  --muted:#7b685b;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#17100d;
  font-family:Georgia,"Times New Roman",serif;
  color:var(--ink);
  padding-bottom:82px;
}
button,input{font:inherit}
button{cursor:pointer}
#app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:
    linear-gradient(rgba(255,250,240,.96),rgba(255,250,240,.96)),
    repeating-linear-gradient(45deg,#eee4d2 0 2px,#f8f0df 2px 6px);
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(135deg,var(--wine2),var(--wine));
  color:white;
  border-bottom:3px solid var(--gold);
  padding:12px;
}
.brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.brand h1{
  font-size:18px;
  margin:0;
  letter-spacing:.8px;
}
.brand small{color:#e8d29a}
.resources{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:9px;
}
.res{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(218,180,91,.55);
  padding:5px;
  text-align:center;
  border-radius:6px;
  font-size:11px;
}
main{padding:13px}
.hero{
  background:linear-gradient(145deg,#7a2830,#3b1115);
  color:white;
  border:2px solid var(--gold);
  border-radius:12px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 6px 16px #0003;
}
.hero h2{margin:0 0 5px;font-size:24px}
.hero p{margin:4px 0;color:#f1dfb2}
.card{
  background:var(--paper);
  border:1px solid #d6c39d;
  border-radius:10px;
  padding:13px;
  margin:10px 0;
  box-shadow:0 3px 8px #44221118;
}
.card h3{
  color:var(--wine);
  margin:0 0 9px;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.btn{
  border:0;
  background:linear-gradient(#8c3139,#5d171e);
  color:white;
  padding:11px 10px;
  border-radius:7px;
  width:100%;
  margin-top:7px;
  border-bottom:2px solid #351015;
}
.btn.gold{
  background:linear-gradient(#d7ad54,#ad7e25);
  color:#27180b;
}
.btn.light{
  background:#eee3cd;
  color:#3d281c;
  border:1px solid #cbb68d;
}
.btn:disabled{
  opacity:.45;
}
.stat{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed #d7c8ab;
  padding:7px 0;
}
.good{color:#19763b;font-weight:bold}
.bad{color:#a52626;font-weight:bold}
.muted{color:var(--muted);font-size:12px}
.tag{
  display:inline-block;
  padding:3px 7px;
  border-radius:99px;
  background:#eee1c5;
  border:1px solid #d1b777;
  font-size:11px;
  margin:2px;
}
.bar{
  height:10px;
  background:#ded2bd;
  border-radius:99px;
  overflow:hidden;
}
.bar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#9b3038,#d19e3b);
}
.gladiator{
  display:flex;
  align-items:center;
  gap:12px;
}
.avatar{
  width:72px;
  height:72px;
  flex:none;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#ded0ad,#9b7434);
  border:3px solid #7b5318;
  font-size:35px;
}
.room{
  text-align:center;
  padding:14px 6px;
  background:#f4ead6;
  border:1px solid #d2bd91;
  border-radius:9px;
}
.room b{display:block;color:var(--wine)}
.eq{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px;
  background:#f6eddc;
  border:1px solid #dac79f;
  margin:6px 0;
  border-radius:7px;
}
.eq strong{color:#6a2027}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:760px;
  margin:auto;
  background:#3c1115;
  border-top:2px solid var(--gold);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  z-index:30;
}
.bottom button{
  background:none;
  color:#e8d8b1;
  border:0;
  padding:10px 2px;
  font-size:9px;
}
.bottom button span{
  display:block;
  font-size:18px;
  margin-bottom:2px;
}
.bottom button.active{
  background:#6d2027;
  color:white;
}
.notice{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:78px;
  width:min(92%,700px);
  background:#261513;
  color:white;
  border:1px solid var(--gold);
  padding:11px;
  border-radius:8px;
  z-index:100;
  display:none;
}
.titleline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.big{
  font-size:26px;
  font-weight:bold;
  color:var(--wine);
}
.center{text-align:center}
hr{
  border:0;
  border-top:1px solid #d8c6a3;
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="brand">
    <div>
      <h1>COLOSSEUM & LUDUS</h1>
      <small id="ludusName">Aurea Ludus</small>
    </div>
    <div style="text-align:right">
      <b id="levelTop">LV.12</b><br>
      <small id="ratingTop">1500 RP</small>
    </div>
  </div>

  <div class="resources">
    <div class="res">🪙 <b id="goldTop">0</b><br>ALTIN</div>
    <div class="res">💎 <b id="diamondTop">0</b><br>ELMAS</div>
    <div class="res">🔵 <b id="sapphireTop">0</b><br>SAFİR</div>
    <div class="res">🟣 <b id="rubyTop">0</b><br>YAKUT</div>
    <div class="res">⭐ <b id="expTop">0</b><br>LUDUS EXP</div>
    <div class="res">⚔️ <b id="gladTop">0</b><br>GLADYATÖR</div>
  </div>
</header>

<main id="screen"></main>

<div class="bottom" id="nav">
  <button onclick="go('home')"><span>🏛️</span>LUDUS</button>
  <button onclick="go('gladiator')"><span>🛡️</span>GLADYATÖR</button>
  <button onclick="go('quest')"><span>📜</span>GÖREV</button>
  <button onclick="go('training')"><span>⚔️</span>EĞİTİM</button>
  <button onclick="go('market')"><span>🏺</span>PAZAR</button>
  <button onclick="go('menu')"><span>☰</span>MENÜ</button>
</div>

<div id="notice" class="notice"></div>

</div>

<script>
const KEY="colosseum_pack1";

const defaults={
  gold:1250000,
  diamond:8,
  sapphire:18,
  ruby:25,
  exp:18400,
  rating:1500,
  level:12,
  selected:0,
  boughtLucius:false,

  profile:{
    username:"MarcusT",
    ludus:"Aurea Ludus",
    country:"Türkiye",
    guild:"Aurea Legio",
    rank:"Bronze III"
  },

  special:{
    felix:3,
    vesper:2,
    tenax:2
  },

  staff:{
    doctore:1,
    faber:1,
    medicus:1,
    coquus:1,
    custos:1
  },

  rooms:{
    training:1,
    forge:1,
    infirmary:1,
    kitchen:1,
    beds:1,
    chest:1
  },

  gladiators:[
    {
      name:"Aulus Varro",
      class:"Murmillo",
      level:12,
      ovr:72,
      hp:1840,
      stamina:610,
      agility:128,
      attack:2690,
      defense:248,
      crit:17,
      block:100,
      condition:84,
      fatigue:16,
      injury:0,
      equipment:[
        {slot:"Silah",name:"Murmillo Kılıcı",plus:5,blue:["Critical +3%"],purple:["Mars +2%"]},
        {slot:"Kalkan",name:"Scutum",plus:3,blue:["Block Rate +4%"],purple:["Aegis +2%"]},
        {slot:"Miğfer",name:"Murmillo Miğferi",plus:4,blue:["Extra HP +3%"],purple:["Concordia +1%"]},
        {slot:"Göğüs",name:"Lorica",plus:6,blue:["Kondisyon +3%"],purple:["Vanguard +2%"]},
        {slot:"Kolluk",name:"Manica",plus:2,blue:["HP Regen +2%"],purple:["Victoria +1%"]},
        {slot:"Bacaklık",name:"Greaves",plus:2,blue:["Kondisyon Regen +2%"],purple:["Team Skill Power +1%"]}
      ]
    },
    {
      name:"Cassius Nero",
      class:"Secutor",
      level:8,
      ovr:64,
      hp:1580,
      stamina:570,
      agility:135,
      attack:2180,
      defense:214,
      crit:14,
      block:82,
      condition:92,
      fatigue:8,
      injury:0,
      equipment:[]
    },
    {
      name:"Titus Flavius",
      class:"Hoplomachus",
      level:7,
      ovr:61,
      hp:1490,
      stamina:550,
      agility:142,
      attack:2050,
      defense:198,
      crit:15,
      block:70,
      condition:88,
      fatigue:12,
      injury:0,
      equipment:[]
    }
  ]
};

let saved={};

try{
  saved=JSON.parse(localStorage.getItem(KEY)||"{}");
}catch(e){
  saved={};
}

let S=merge(defaults,saved);

if(S.boughtLucius && !S.gladiators.some(g=>g.name==="Lucius Drusus")){
  S.gladiators.push({
    name:"Lucius Drusus",
    class:"Retiarius",
    level:9,
    ovr:66,
    hp:1510,
    stamina:590,
    agility:161,
    attack:2310,
    defense:175,
    crit:19,
    block:35,
    condition:100,
    fatigue:0,
    injury:0,
    equipment:[]
  });
}

function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));
  for(const k in b){
    if(
      b[k] &&
      typeof b[k]==="object" &&
      !Array.isArray(b[k]) &&
      typeof out[k]==="object" &&
      !Array.isArray(out[k])
    ){
      out[k]={...out[k],...b[k]};
    }else{
      out[k]=b[k];
    }
  }
  return out;
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(S));
  updateTop();
}

function fmt(n){
  return Number(n||0).toLocaleString("tr-TR");
}

function updateTop(){
  document.getElementById("goldTop").textContent=fmt(S.gold);
  document.getElementById("diamondTop").textContent=fmt(S.diamond);
  document.getElementById("sapphireTop").textContent=fmt(S.sapphire);
  document.getElementById("rubyTop").textContent=fmt(S.ruby);
  document.getElementById("expTop").textContent=fmt(S.exp);
  document.getElementById("gladTop").textContent=S.gladiators.length;
  document.getElementById("levelTop").textContent="LV."+S.level;
  document.getElementById("ratingTop").textContent=S.rating+" RP";
  document.getElementById("ludusName").textContent=S.profile.ludus;
}

function notify(t){
  const n=document.getElementById("notice");
  n.textContent=t;
  n.style.display="block";
  clearTimeout(window.noticeTimer);
  window.noticeTimer=setTimeout(()=>n.style.display="none",2800);
}

let current="home";

function go(name){
  current=name;
  document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));
  const map={
    home:0,
    gladiator:1,
    quest:2,
    training:3,
    market:4,
    menu:5
  };
  if(map[name]!==undefined){
    document.querySelectorAll(".bottom button")[map[name]].classList.add("active");
  }
  render();
  window.scrollTo(0,0);
}

function g(){
  return S.gladiators[S.selected]||S.gladiators[0];
}

function render(){
  updateTop();
  const el=document.getElementById("screen");

  if(current==="home") el.innerHTML=homeHTML();
  if(current==="gladiator") el.innerHTML=gladiatorHTML();
  if(current==="equipment") el.innerHTML=equipmentHTML();
  if(current==="upgrade") el.innerHTML=upgradeHTML();
  if(current==="inventory") el.innerHTML=inventoryHTML();
  if(current==="management") el.innerHTML=managementHTML();
  if(current==="quest") el.innerHTML=questHTML();
  if(current==="training") el.innerHTML=trainingHTML();
  if(current==="rest") el.innerHTML=restHTML();
  if(current==="market") el.innerHTML=marketHTML();
  if(current==="profile") el.innerHTML=profileHTML();
  if(current==="arena") el.innerHTML=arenaHTML();
  if(current==="menu") el.innerHTML=menuHTML();
}

function homeHTML(){
  return `
  <section class="hero">
    <h2>${S.profile.ludus}</h2>
    <p>Ludus Seviyesi ${S.level} · ${S.gladiators.length} Gladyatör</p>
    <p>Roma'da şöhret, servet ve güç için Ludus'unu geliştir.</p>
  </section>

  <div class="card">
    <div class="titleline">
      <h3>LUDUS</h3>
      <b>Güç ${totalPower()}</b>
    </div>

    <div class="grid3">
      ${room("⚔️","Eğitim","training")}
      ${room("🔨","Faber","forge")}
      ${room("⚕️","Revir","infirmary")}
      ${room("🍖","Mutfak","kitchen")}
      ${room("🛏️","Yataklar","beds")}
      ${room("📦","Sandık","chest")}
    </div>
  </div>

  <div class="card">
    <h3>Gladyatörler</h3>
    ${S.gladiators.map((x,i)=>`
      <div class="eq" onclick="selectGlad(${i})">
        <div>
          <strong>${x.name}</strong>
          <div class="muted">${x.class} · Lv.${x.level}</div>
        </div>
        <div class="big">${x.ovr}</div>
      </div>
    `).join("")}
  </div>

  <div class="grid2">
    <button class="btn" onclick="go('quest')">📜 Görevlere Git</button>
    <button class="btn gold" onclick="go('training')">⚔️ Antrenman</button>
  </div>
  `;
}

function room(icon,name,key){
  return `
    <div class="room">
      <div style="font-size:25px">${icon}</div>
      <b>${name}</b>
      <small>Seviye ${S.rooms[key]}</small>
    </div>
  `;
}

function totalPower(){
  return S.gladiators.reduce((a,x)=>a+x.ovr,0)+
  Object.values(S.staff).reduce((a,x)=>a+x,0)*5;
}

function selectGlad(i){
  S.selected=i;
  save();
  go("gladiator");
}

function gladiatorHTML(){
  const x=g();

  return `
  <div class="card">
    <div class="gladiator">
      <div class="avatar">⚔️</div>
      <div>
        <h3 style="margin:0">${x.name}</h3>
        <div>${x.class} · Seviye ${x.level}</div>
        <div class="big">OVR ${x.ovr}</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Durum</h3>
    <div class="stat"><span>Kondisyon</span><b>${x.condition}/100</b></div>
    <div class="bar"><span style="width:${x.condition}%"></span></div>

    <div class="stat"><span>Yorgunluk</span><b>${x.fatigue}%</b></div>

    <div class="stat">
      <span>Sakatlık</span>
      <b>${x.injury ? "Seviye "+x.injury : "Yok"}</b>
    </div>

    <button class="btn light" onclick="go('rest')">🛏️ Dinlenme</button>
  </div>

  <div class="card">
    <h3>Savaş İstatistikleri</h3>
    <div class="stat"><span>Health</span><b>${fmt(x.hp)}</b></div>
    <div class="stat"><span>Stamina</span><b>${fmt(x.stamina)}</b></div>
    <div class="stat"><span>Agility</span><b>${fmt(x.agility)}</b></div>
    <div class="stat"><span>Physical Attack</span><b>${fmt(x.attack)}</b></div>
    <div class="stat"><span>Physical Defense</span><b>${fmt(x.defense)}</b></div>
    <div class="stat"><span>Critical</span><b>${x.crit}%</b></div>
    <div class="stat"><span>Block Rate</span><b>${x.block}%</b></div>
  </div>

  <div class="grid2">
    <button class="btn" onclick="go('equipment')">🛡️ Ekipman</button>
    <button class="btn gold" onclick="go('training')">⚔️ Antrenman</button>
  </div>
  `;
}

function equipmentHTML(){
  const x=g();
  let eq=x.equipment||[];

  if(!eq.length){
    return `
      <div class="card center">
        <h3>${x.name}</h3>
        <p>Bu gladyatörün detaylı ekipman seti henüz oluşturulmadı.</p>
        <button class="btn" onclick="go('gladiator')">Geri Dön</button>
      </div>
    `;
  }

  return `
  <div class="hero">
    <h2>Ekipman</h2>
    <p>${x.name} · ${x.class}</p>
  </div>

  ${eq.map((e,i)=>`
    <div class="card">
      <div class="titleline">
        <div>
          <div class="muted">${e.slot}</div>
          <h3>${e.name}</h3>
        </div>
        <div class="big">+${e.plus}</div>
      </div>

      <hr>

      <b>Safir</b>
      <div>
        ${(e.blue||[]).map(a=>`<span class="tag">🔵 ${a}</span>`).join("")}
      </div>

      <br>

      <b>Yakut</b>
      <div>
        ${(e.purple||[]).map(a=>`<span class="tag">🟣 ${a}</span>`).join("")}
      </div>

      <button class="btn" onclick="upgradeItem(${i})">Geliştirmeyi Aç</button>
    </div>
  `).join("")}

  <button class="btn light" onclick="go('inventory')">Taş Envanteri</button>
  `;
}

let upgradeIndex=0;

function upgradeItem(i){
  upgradeIndex=i;
  current="upgrade";
  render();
  window.scrollTo(0,0);
}

function upgradeHTML(){
  const x=g();
  const e=x.equipment[upgradeIndex];

  if(!e){
    return `<div class="card">Ekipman bulunamadı.</div>`;
  }

  const risky=e.plus>=5;

  return `
  <div class="hero">
    <h2>${e.name}</h2>
    <p>${e.slot} · Mevcut +${e.plus}</p>
  </div>

  <div class="card center">
    <div style="font-size:65px">⚔️</div>
    <div class="big">+${e.plus} → +${e.plus+1}</div>

    <p>
      Geliştirme maliyeti:
      <b>1 Elmas</b>
    </p>

    ${
      risky
      ? `
        <div class="card" style="background:#fff0e9">
          <b class="bad">Riskli geliştirme</b>
          <p class="muted">
            +5 sonrasında başarısız geliştirmelerde eşya yok olabilir.
          </p>
        </div>
      `
      : `
        <p class="good">Güvenli geliştirme seviyesi</p>
      `
    }

    <div class="stat">
      <span>FELIX</span>
      <b>×${S.special.felix}</b>
    </div>

    <p class="muted">
      FELIX mevcutsa başarı ihtimaline +5 puan ekler.
      Kullanılan FELIX geliştirme denemesinde tüketilir.
    </p>

    <button class="btn gold" onclick="enhanceNow()">
      💎 Geliştirmeyi Dene
    </button>
  </div>
  `;
}

function enhanceNow(){
  const x=g();
  const e=x.equipment[upgradeIndex];

  if(S.diamond<1){
    notify("Yeterli Elmas yok.");
    return;
  }

  S.diamond--;

  const hasFelix=S.special.felix>0;

  if(hasFelix){
    S.special.felix--;
  }

  if(e.plus<5){
    e.plus++;
    save();
    notify(e.name+" +"+e.plus+" oldu.");
    render();
    return;
  }

  const successChance=hasFelix ? 75 : 70;
  const roll=Math.random()*100;

  if(roll<successChance){
    e.plus++;
    save();
    notify("Geliştirme başarılı: +"+e.plus);
    render();
    return;
  }

  const destroyRoll=Math.random()*100;

  if(destroyRoll<20){
    e.plus=0;
    e.blue=[];
    e.purple=[];
    save();
    notify("Geliştirme başarısız. Eşya yok oldu.");
    go("equipment");
    return;
  }

  save();
  notify("Geliştirme başarısız. Eşya korundu.");
  render();
}

function inventoryHTML(){
  return `
  <div class="hero">
    <h2>Taş Envanteri</h2>
    <p>Geliştirme ve ekipman taşlarını yönet.</p>
  </div>

  <div class="card">
    <div class="stat"><span>💎 Elmas</span><b>${S.diamond}</b></div>
    <div class="stat"><span>🔵 Safir</span><b>${S.sapphire}</b></div>
    <div class="stat"><span>🟣 Yakut</span><b>${S.ruby}</b></div>
  </div>

  <div class="card">
    <h3>Özel Taşlar</h3>
    <div class="stat"><span>FELIX</span><b>×${S.special.felix}</b></div>
    <div class="stat"><span>VESPER</span><b>×${S.special.vesper}</b></div>
    <div class="stat"><span>TENAX</span><b>×${S.special.tenax}</b></div>
  </div>

  <div class="card">
    <h3>Safir Etkileri</h3>
    <span class="tag">Extra HP</span>

function doMission(i){
  const m=missions[i];
  const x=g();

  if(x.injury){
    notify("Bu gladyatör sakat. Önce iyileşmeli.");
    return;
  }

  if(x.condition<m.condition){
    notify("Yeterli kondisyon yok.");
    return;
  }

  x.condition-=m.condition;
  x.fatigue=Math.min(100,x.fatigue+m.condition);

  S.gold+=m.gold;
  S.exp+=m.exp;
  S.sapphire+=m.sapphire;
  S.ruby+=m.ruby;
  S.diamond+=m.diamond;

  save();

  document.getElementById("screen").innerHTML=`
    <div class="hero center">
      <div style="font-size:55px">🏛️</div>
      <h2>Görev Tamamlandı</h2>
      <p>${m.name}</p>
    </div>

    <div class="card">
      <h3>Ödüller</h3>
      <div class="stat"><span>Altın</span><b class="good">+${fmt(m.gold)}</b></div>
      <div class="stat"><span>Ludus EXP</span><b class="good">+${m.exp}</b></div>
      <div class="stat"><span>Safir</span><b class="good">+${m.sapphire}</b></div>
      <div class="stat"><span>Yakut</span><b class="good">+${m.ruby}</b></div>
      <div class="stat"><span>Elmas</span><b class="good">+${m.diamond}</b></div>
    </div>

    <div class="card">
      <div class="stat"><span>${x.name}</span><b>${x.condition}/100 Kondisyon</b></div>
      <div class="stat"><span>Yorgunluk</span><b>${x.fatigue}%</b></div>
    </div>

    <button class="btn gold" onclick="go('quest')">Görevlere Dön</button>
    <button class="btn light" onclick="go('home')">Ludus'a Dön</button>
  `;

  updateTop();
}

function train(type){
  const x=g();

  if(x.condition<8){
    notify("Antrenman için kondisyon yetersiz.");
    return;
  }

  if(x.injury){
    notify("Sakat gladyatör antrenman yapamaz.");
    return;
  }

  x.condition-=8;
  x.fatigue=Math.min(100,x.fatigue+8);

  if(type==="attack") x.attack+=10;
  if(type==="defense") x.defense+=2;
  if(type==="agility") x.agility+=2;

  S.exp+=120;

  save();
  notify("Antrenman tamamlandı. +120 Ludus EXP");
  render();
}
